ure is fixed and well known.<br>Otherwise use FCFF: it is cleaner and not distorted by borrowing.</p></div></details><details class="qa"><summary><span class="chip">Interview</span> Why is the cost of equity higher than the cost of debt?</summary><div class="rich"><ul><li>Equity is the residual claim, paid after lenders, so it carries more risk</li><li>Debt has contractual interest and security</li><li>Interest is tax-deductible, lowering the after-tax cost of debt further</li></ul></div></details><details class="qa"><summary><span class="chip">Interview</span> Does adding debt always lower WACC?</summary><div class="rich"><p>No. Initially yes: debt is cheaper and creates a tax shield. But as leverage rises, both Ke and Kd rise with financial risk, and distress costs mount. WACC is U-shaped, with an optimal capital structure in between.</p></div></details><details class="qa"><summary><span class="chip">Formula</span> Present value formula and discount factor?</summary><div class="rich"><div class="fx">PV = CF ÷ (1 + r)^n</div><div class="fx">Discount factor = 1 ÷ (1 + r)^n</div><p>Example: $100 in 3 years at 10% → 100 ÷ 1.331 = $75.13.</p></div></details><details class="qa"><summary><span class="chip">Concept</span> How does an LBO work and what drives returns?</summary><div class="rich"><p>A financial sponsor buys a company using mostly debt (often 40–60%), uses the company's FCF to pay down debt, and exits after 3–7 years.<br>Returns come from:</p><ul><li>EBITDA growth</li><li>Multiple expansion (exit multiple &gt; entry)</li><li>Debt paydown (equity's share of EV rises)</li></ul><p>Targets: 20–25% IRR, 2–3x MOIC.</p></div></details><details class="qa"><summary><span class="chip">Concept</span> What makes a good LBO candidate?</summary><div class="rich"><ul><li>Stable, predictable cash flows</li><li>Low capex needs and working capital</li><li>Strong market position</li><li>Low existing debt and assets to borrow against</li><li>Cost-cutting or operational upside</li><li>A clear exit path (trade sale, IPO)</li></ul></div></details><details class="qa"><summary><span class="chip">Concept</span> Quick rules for whether an acquisition is EPS accretive?</summary><div class="rich"><ul><li><strong>All-stock</strong>: accretive if the acquirer's P/E &gt; the P/E paid for the target</li><li><strong>All-cash (debt)</strong>: accretive if the target's earnings yield at the price paid (NPAT ÷ price) &gt; the after-tax cost of debt</li><li><strong>Cash on hand</strong>: compare with the after-tax interest forgone</li></ul><p>Synergies make deals more accretive; EPS accretion does not mean value creation.</p></div></details><details class="qa"><summary><span class="chip">Concept</span> How do you think about synergies in M&amp;A?</summary><div class="rich"><ul><li><strong>Cost synergies</strong>: overlapping costs, procurement, sites. More credible</li><li><strong>Revenue synergies</strong>: cross-selling, pricing. Less reliable</li></ul><p>Value = PV of after-tax synergies, less integration costs, phased in. Paying a premium above the synergy value destroys value for the acquirer.</p></div></details><details class="qa"><summary><span class="chip">Concept</span> From DCF enterprise value, how do you get to value per share?</summary><div class="rich"><div class="fx">Equity value = EV − Debt − Lease liabilities* − NCI − Preference shares + Cash + Associates/non-operating assets</div><div class="fx">Value per share = Equity value ÷ Diluted shares</div><p>*If leases are treated as debt in the FCFF (post-AASB 16 cash flows).</p></div></details></div></section><section id="s-rt" class="block"><div class="eyebrow">Section</div><h2 style="font-size:24px">Ratios</h2><details class="notes-body"><summary><strong>Notes</strong></summary><div class="rich"><h3>Profitability and returns</h3><div class="fx">Margin = Profit line ÷ Revenue (gross, EBITDA, EBIT, NPAT)</div><div class="fx">ROE = NPAT ÷ Average equity</div><div class="fx">DuPont: ROE = (NPAT ÷ Revenue) × (Revenue ÷ Assets) × (Assets ÷ Equity)</div><div class="fx">ROA = NPAT ÷ Average total assets</div><div class="fx">ROIC = EBIT × (1 − t) ÷ Invested capital   (IC = NWC + net PP&amp;E + intangibles ≈ Debt + Equity − Cash)</div><div class="fx">ROCE = EBIT ÷ (Total assets − Current liabilities)</div><p>Value is created only when ROIC &gt; WACC.</p><h3>Working capital</h3><div class="fx">DSO = Receivables ÷ Revenue × 365</div><div class="fx">DIO = Inventory ÷ COGS × 365</div><div class="fx">DPO = Payables ÷ COGS × 365</div><div class="fx">Cash conversion cycle = DSO + DIO − DPO</div><h3>Leverage and liquidity</h3><div class="fx">Net debt ÷ EBITDA   (above ~3x is high for most industrials)</div><div class="fx">Gearing = Net debt ÷ (Net debt + Equity)</div><div class="fx">Interest cover = EBIT ÷ Net interest   (below ~3x is a concern)</div><div class="fx">Current ratio = Current assets ÷ Current liabilities</div><div class="fx">Quick ratio = (Current assets − Inventory) ÷ Current liabilities</div><h3>Growth</h3><ul><li>Like-for-like (same-store) sales strip out new stores; total growth = LFL + new space</li><li>Organic growth strips out acquisitions and FX (constant currency)</li></ul><div class="fx">Sustainable growth = ROE × (1 − Payout ratio)</div><div class="fx">Degree of operating leverage = %Δ EBIT ÷ %Δ Revenue</div></div></details><h3 style="margin-top:8px">Cards: tap a question to reveal the answer</h3><div><details class="qa"><summary><span class="chip">Formula</span> Define gross, EBITDA, EBIT and NPAT margin.</summary><div class="rich"><div class="fx">Margin = Profit line ÷ Revenue</div><ul><li><strong>Gross</strong>: (Revenue − COGS) ÷ Revenue; pricing power and sourcing</li><li><strong>EBITDA</strong>: operating profit before D&amp;A</li><li><strong>EBIT</strong>: operating profit after D&amp;A</li><li><strong>NPAT</strong>: after interest and tax</li></ul></div></details><details class="qa"><summary><span class="chip">Formula</span> ROE and its DuPont breakdown?</summary><div class="rich"><div class="fx">ROE = NPAT ÷ Average equity</div><div class="fx">ROE = (NPAT ÷ Revenue) × (Revenue ÷ Assets) × (Assets ÷ Equity)</div><div class="fx">ROE = Margin × Asset turnover × Equity multiplier (leverage)</div><p>Shows whether ROE comes from profitability, efficiency or debt.</p></div></details><details class="qa"><summary><span class="chip">Formula</span> ROA formula?</summary><div class="rich"><div class="fx">ROA = NPAT ÷ Average total assets</div><p>Some use EBIT × (1 − t) to keep it independent of financing. Useful for banks (ROA ~1%) and asset-heavy firms.</p></div></details><details class="qa"><summary><span class="chip">Formula</span> ROIC formula and why it matters?</summary><div class="rich"><div class="fx">ROIC = NOPAT ÷ Invested capital = EBIT × (1 − t) ÷ IC</div><div class="fx">IC = NWC + Net PP&amp;E + Intangibles ≈ Debt + Equity − Cash</div><p>Growth creates value only when ROIC &gt; WACC. Best single measure of business quality.</p></div></details><details class="qa"><summary><span class="chip">Formula</span> ROCE formula?</summary><div class="rich"><div class="fx">ROCE = EBIT ÷ (Total assets − Current liabilities)</div><p>Pre-tax and common in Australian and UK reporting and remuneration hurdles. Similar to ROIC but before tax and with a balance-sheet definition of capital.</p></div></details><details class="qa"><summary><span class="chip">Formula</span> DSO, DIO, DPO and the cash conversion cycle?</summary><div class="rich"><div class="fx">DSO = Receivables ÷ Revenue × 365</div><div class="fx">DIO = Inventory ÷ COGS × 365</div><div class="fx">DPO = Payables ÷ COGS × 365</div><div class="fx">CCC = DSO + DIO − DPO</div><p>Days between paying suppliers and collecting from customers. Lower (or negative) is better.</p></div></details><details class="qa"><summary><span class="chip">Formula</span> Current ratio vs quick ratio?</summary><div class="rich"><div class="fx">Current ratio = Current assets ÷ Current liabilities</div><div class="fx">Quick ratio = (Current assets − Inventory) ÷ Current liabilities</div><p>Quick ratio excludes inventory because it may be slow to convert to cash. Retailers often run below 1 comfortably.</p></div></details><details class="qa"><summary><span class="chip">Formula</span> Net debt/EBITDA and gearing: definitions and comfort levels?</summary><div class="rich"><div class="fx">Leverage = Net debt ÷ EBITDA</div><div class="fx">Gearing = Net debt ÷ (Net debt + Equity)</div><p>Below ~1.5x is conservative; above ~3x is high for most industrials; banking covenants often sit around 3–3.5x. Infrastructure and REITs run higher.</p></div></details><details class="qa"><summary><span class="chip">Formula</span> Interest cover?</summary><div class="rich"><div class="fx">Interest cover = EBIT ÷ Net interest expense   (or EBITDA ÷ interest)</div><p>Below ~3x is a concern; a common lender covenant.</p></div></details><details class="qa"><summary><span class="chip">Concept</span> Like-for-like (same-store) sales vs total sales growth?</summary><div class="rich"><ul><li><strong>LFL</strong>: growth from stores open in both periods (usually 12+ months). Shows underlying demand</li><li><strong>Total growth</strong> = LFL + new space − closures</li></ul><p>A retailer can show strong total growth from rollout while LFL is negative, which is a warning sign.</p></div></details><details class="qa"><summary><span class="chip">Concept</span> Organic growth vs reported growth?</summary><div class="rich"><p>Organic growth strips out acquisitions, divestments and FX movements (constant currency). Reported growth can be flattered by acquisitions; organic shows how the existing business is doing.</p></div></details><details class="qa"><summary><span class="chip">Concept</span> What is operating leverage?</summary><div class="rich"><p>When a large share of costs is fixed, EBIT grows faster than revenue in good times and falls faster in bad times.</p><div class="fx">DOL = %Δ EBIT ÷ %Δ Revenue</div><p>Retailers with fixed rent and staff costs have high operating leverage to LFL sales.</p></div></details><details class="qa"><summary><span class="chip">Interview</span> When can a high ROE be a bad sign?</summary><div class="rich"><ul><li>Driven by high leverage rather than margins or turnover (check DuPont)</li><li>Equity shrunk by buybacks, write-downs or accumulated losses</li><li>Negative or tiny equity making the ratio meaningless</li><li>A one-off gain inflating NPAT</li></ul></div></details><details class="qa"><summary><span class="chip">Interview</span> A company's inventory days have jumped. What might it mean?</summary><div class="rich"><ul><li>Sales slowing faster than buying (bad: markdown risk ahead)</li><li>Obsolete or slow-moving stock</li><li>Deliberate stock build ahead of a season, supply chain issues, or price rises</li></ul><p>Check gross margin trends and the commentary. Rising inventory with falling margin is a red flag.</p></div></details><details class="qa"><summary><span class="chip">Formula</span> Payout ratio and sustainable growth rate?</summary><div class="rich"><div class="fx">Payout ratio = DPS ÷ EPS</div><div class="fx">Retention ratio = 1 − Payout ratio</div><div class="fx">Sustainable growth g = ROE × Retention ratio</div><p>Growth that can be funded from retained earnings without new equity or more leverage.</p></div></details></div></section><section id="s-acc" class="block"><div class="eyebrow">Section</div><h2 style="font-size:24px">Accounting traps</h2><details class="notes-body"><summary><strong>Notes</strong></summary><div class="rich"><h3>AASB 16 leases (lessee)</h3><div class="tw"><table><thead><tr><th>Line</th><th>Pre-AASB 16</th><th>Post-AASB 16</th></tr></thead><tbody><tr><td>Rent</td><td>Opex, above EBITDA</td><td>Gone</td></tr><tr><td>Depreciation</td><td>–</td><td>ROU asset depreciation</td></tr><tr><td>Interest</td><td>–</td><td>Interest on lease liability</td></tr><tr><td>EBITDA</td><td>Lower</td><td>Higher</td></tr><tr><td>NPAT (early years)</td><td>Higher</td><td>Lower (interest is front-loaded)</td></tr><tr><td>CFO</td><td>Lower</td><td>Higher (principal moves to CFF)</td></tr><tr><td>Net debt</td><td>Excludes leases</td><td>Includes lease liabilities if you choose</td></tr></tbody></table></div><p>Rule: post-AASB 16 EBITDA pairs with EV including lease liabilities; pre-AASB 16 EBITDA (rent deducted) pairs with EV excluding leases. Many ASX retailers report "pre-AASB 16" underlying numbers.</p><h3>Other traps</h3><div class="tw"><table><thead><tr><th>Topic</th><th>What to know</th></tr></thead><tbody><tr><td>Share-based payments</td><td>Non-cash expense at grant-date fair value over vesting; a real cost through dilution</td></tr><tr><td>Deferred tax</td><td>DTL when accounting profit &gt; taxable profit (e.g. accelerated tax depreciation); DTA from tax losses and provisions</td></tr><tr><td>Goodwill</td><td>Price paid − fair value of net identifiable assets; not amortised; annual impairment test</td></tr><tr><td>Capitalised costs</td><td>Boost EBITDA now; watch software/development capitalisation trends</td></tr><tr><td>Revenue (AASB 15)</td><td>Five steps; customer deposits sit as contract liabilities until delivery</td></tr><tr><td>Consolidation</td><td>&gt;50% consolidate with NCI; 20–50% equity-account; &lt;20% fair value</td></tr><tr><td>Inventory</td><td>FIFO or weighted average; LIFO banned under IFRS; lower of cost and NRV</td></tr></tbody></table></div><h3>Earnings quality red flags</h3><ul><li>CFO persistently below NPAT</li><li>Receivable or inventory days rising faster than sales</li><li>"One-off" significant items every year</li><li>Rising capitalisation of costs, lengthening useful lives</li><li>Auditor changes, qualified opinions, related-party dealings</li></ul></div></details><h3 style="margin-top:8px">Cards: tap a question to reveal the answer</h3><div><details class="qa"><summary><span class="chip">Concept</span> What does AASB 16 do to a lessee's financial statements?</summary><div class="rich"><p>Leases go on balance sheet: a right-of-use asset and a lease liability.</p><ul><li>Rent expense disappears; replaced by ROU depreciation + lease interest</li><li><strong>EBITDA up</strong> a lot, EBIT up slightly</li><li><strong>NPAT down</strong> in early years (interest is front-loaded)</li><li><strong>CFO up</strong>, CFF down (principal in CFF); total cash unchanged</li><li>Net debt up if leases are included</li></ul></div></details><details class="qa"><summary><span class="chip">Interview</span> How do you compare EV/EBITDA across companies when leases are involved?</summary><div class="rich"><p>Be consistent:</p><ul><li><strong>Post-AASB 16</strong>: EBITDA (rent excluded) with EV <strong>including</strong> lease liabilities</li><li><strong>Pre-AASB 16</strong>: EBITDA after deducting rent with EV <strong>excluding</strong> leases</li></ul><p>Never mix. Many ASX retailers report "pre-AASB 16" underlying numbers; EV/EBIT is less distorted.</p></div></details><details class="qa"><summary><span class="chip">Concept</span> How is share-based payment expense accounted for?</summary><div class="rich"><p>Measured at grant-date fair value (option pricing model) and expensed over the vesting period, with a credit to the SBP reserve in equity.<br>Non-cash, so added back in CFO, but it costs shareholders through dilution. Many companies exclude it from "adjusted" earnings; be sceptical.</p></div></details><details class="qa"><summary><span class="chip">Concept</span> What creates deferred tax liabilities and assets?</summary><div class="rich"><p>Timing differences between accounting and tax:</p><ul><li><strong>DTL</strong>: accounting profit &gt; taxable profit now, e.g. tax depreciation faster than accounting depreciation. Tax is deferred</li><li><strong>DTA</strong>: taxable profit &gt; accounting profit now, e.g. provisions not yet deductible, tax losses carried forward</li></ul><p>A large DTA from losses has value only if future profits are likely.</p></div></details><details class="qa"><summary><span class="chip">Concept</span> How does goodwill work under IFRS/AASB?</summary><div class="rich"><div class="fx">Goodwill = Price paid − Fair value of net identifiable assets acquired</div><p>Not amortised. Tested for impairment at least annually by comparing carrying amount with recoverable amount (value in use or fair value less costs to sell).<br>Impairments are non-cash, usually not tax-deductible, and signal the acquisition underdelivered.</p></div></details><details class="qa"><summary><span class="chip">Concept</span> Why watch capitalised costs (software, development)?</summary><div class="rich"><p>Capitalising moves spending from opex (hits EBITDA now) to an intangible asset (amortised later, below EBITDA). It inflates EBITDA and EBIT in the short term.<br>Red flags: capitalised amount rising faster than revenue, capitalised ÷ total spend rising, short amortisation lives being lengthened.</p></div></details><details class="qa"><summary><span class="chip">Concept</span> AASB 15 revenue recognition: the five steps?</summary><div class="rich"><ul><li>Identify the contract</li><li>Identify performance obligations</li><li>Determine the transaction price</li><li>Allocate the price to the obligations</li><li>Recognise revenue when (or as) each obligation is satisfied</li></ul><p>Deposits received before delivery are contract liabilities, not revenue (e.g. furniture retailers recognise revenue on delivery).</p></div></details><details class="qa"><summary><span class="chip">Concept</span> Subsidiary vs associate vs investment: how is each accounted for?</summary><div class="rich"><div class="tw"><table><thead><tr><th>Ownership</th><th>Treatment</th></tr></thead><tbody><tr><td>&gt;50% (control)</td><td>Consolidate 100%; show NCI in equity and profit</td></tr><tr><td>20–50% (significant influence)</td><td>Equity accounting: one line for share of profit, one asset line</td></tr><tr><td>&lt;20%</td><td>Financial asset at fair value</td></tr></tbody></table></div></div></details><details class="qa"><summary><span class="chip">Concept</span> How should you treat "one-off" significant items that appear every year?</summary><div class="rich"><p>As operating costs. If restructuring, impairments or "transformation" costs recur, they are part of running the business. Add them back into underlying earnings, or at least average them, before applying a multiple.</p></div></details><details class="qa"><summary><span class="chip">Concept</span> How is inventory measured under AASB/IFRS?</summary><div class="rich"><p>At the <strong>lower of cost and net realisable value</strong>. Cost uses FIFO or weighted average; <strong>LIFO is banned</strong> under IFRS (allowed under US GAAP).<br>Write-downs to NRV hit COGS and gross margin.</p></div></details><details class="qa"><summary><span class="chip">Concept</span> What are provisions and how can they be used to manage earnings?</summary><div class="rich"><p>Liabilities of uncertain timing or amount (warranties, restructuring, make-good, employee leave, legal). Booking one expenses it now; using it later is non-cash.<br>Risk: over-providing in a bad year ("big bath") and releasing it later to boost profit ("cookie jar"). Watch provision movements in the notes.</p></div></details><details class="qa"><summary><span class="chip">Concept</span> What should you check when a company reports "adjusted EBITDA"?</summary><div class="rich"><ul><li>What is excluded: SBC, restructuring, acquisition costs, AASB 16 effects</li><li>Whether exclusions recur</li><li>Whether it reconciles to statutory numbers</li><li>Whether it matches the definition used by consensus and peers</li></ul><p>The more adjustments, the more scepticism.</p></div></details><details class="qa"><summary><span class="chip">Concept</span> What effect do longer useful lives for depreciation have?</summary><div class="rich"><p>Lower annual depreciation → higher EBIT and NPAT, with no change in cash. Compare D&amp;A ÷ capex and D&amp;A ÷ PP&amp;E over time and with peers; a falling ratio may mean lives are being stretched.</p></div></details><details class="qa"><summary><span class="chip">Concept</span> List common earnings quality red flags.</summary><div class="rich"><ul><li>CFO persistently below NPAT</li><li>Receivable or inventory days rising faster than sales</li><li>Recurring "one-off" items</li><li>Rising capitalisation of costs or lengthening useful lives</li><li>Big provision releases</li><li>Auditor changes, qualified opinions, related-party transactions</li></ul></div></details><details class="qa"><summary><span class="chip">Interview</span> A company extends the useful life of its assets. Walk through the effect on the statements.</summary><div class="rich"><p><strong>IS</strong>: depreciation down → EBIT and PBT up; tax expense up; NPAT up.<br><strong>Cash</strong>: no change, because tax depreciation follows tax rules, not accounting lives. The higher tax expense is deferred (DTL up).<br><strong>BS</strong>: PP&amp;E higher than otherwise; retained earnings up; DTL up.<br>Profit up, cash unchanged: a lower-quality earnings boost.</p></div></details></div></section><section id="s-au" class="block"><div class="eyebrow">Section</div><h2 style="font-size:24px">Australia-specific</h2><details class="notes-body"><summary><strong>Notes</strong></summary><div class="rich"><h3>Franking credits</h3><p>Company tax already paid (30%, or 25% for base-rate entities) is attached to dividends as franking credits. Resident shareholders include the grossed-up dividend in income and get a tax offset for the credit.</p><div class="fx">Franking credit = Cash dividend × Franking % × t ÷ (1 − t)</div><div class="fx">Grossed-up dividend = Cash dividend + Franking credit</div><p>A fully franked 70c dividend carries a 30c credit → 100c grossed up.</p><h3>ASX reporting</h3><div class="tw"><table><thead><tr><th>Document</th><th>What</th><th>Deadline</th></tr></thead><tbody><tr><td>Appendix 4D</td><td>Half-year report</td><td>Within 2 months of half-year end</td></tr><tr><td>Appendix 4E</td><td>Preliminary final report</td><td>Within 2 months of year end</td></tr><tr><td>Annual report</td><td>Full statutory accounts</td><td>Within 3 months of year end</td></tr><tr><td>Quarterly (4C / 5B)</td><td>Cash flow reports for some entities and explorers</td><td>1 month after quarter</td></tr></tbody></table></div><p>June year-end companies report in February (half) and August (full): "reporting season".<br>Continuous disclosure (LR 3.1): price-sensitive information must be released immediately.</p><h3>Typical Australian DCF inputs</h3><ul><li>rf: 10-year Australian Government bond (ACGB) yield</li><li>ERP: about 6% is common practice</li><li>Beta: vs the S&amp;P/ASX 200; adjusted beta = 0.67 × raw + 0.33</li><li>Corporate tax: 30%</li></ul><h3>Capital raisings</h3><div class="tw"><table><thead><tr><th>Type</th><th>Who</th><th>Notes</th></tr></thead><tbody><tr><td>Placement</td><td>Institutions</td><td>15% capacity under LR 7.1 (+10% under 7.1A for eligible small/mid caps); usually a 5–10% discount</td></tr><tr><td>SPP</td><td>Retail holders</td><td>Up to $30,000 per holder in 12 months</td></tr><tr><td>Entitlement offer</td><td>All holders pro rata</td><td>Renounceable or not; accelerated (ANREO/AREO)</td></tr></tbody></table></div><div class="fx">TERP = (Old shares × Price + New shares × Offer price) ÷ (Old shares + New shares)</div></div></details><h3 style="margin-top:8px">Cards: tap a question to reveal the answer</h3><div><details class="qa"><summary><span class="chip">Concept</span> How do franking credits work?</summary><div class="rich"><p>Australia's imputation system: tax a company has paid (30%, or 25% for base-rate entities) is passed to shareholders as franking credits attached to dividends.<br>Resident shareholders declare the grossed-up dividend and receive the credit as a tax offset (refundable for low-tax investors like super funds in pension phase). Foreign investors generally can't use them.</p></div></details><details class="qa"><summary><span class="chip">Formula</span> Franking credit and grossed-up dividend formulas?</summary><div class="rich"><div class="fx">Franking credit = Dividend × Franking % × t ÷ (1 − t)</div><div class="fx">Grossed-up dividend = Dividend + Franking credit</div><p>Fully franked 70c → credit 70 × 0.3 ÷ 0.7 = 30c → grossed up 100c.</p></div></details><details class="qa"><summary><span class="chip">Concept</span> What does the ASX reporting calendar look like?</summary><div class="rich"><ul><li>Most companies have June year-ends: half-year results in <strong>February</strong>, full year in <strong>August</strong> (reporting season)</li><li>December year-ends report full year in February and half year in August</li><li>Appendix 4D / 4E within 2 months of period end; annual report within 3 months</li><li>Many also give AGM trading updates (Oct–Nov), a common time for guidance changes</li></ul></div></details><details class="qa"><summary><span class="chip">Concept</span> What is continuous disclosure (ASX Listing Rule 3.1)?</summary><div class="rich"><p>Listed entities must immediately disclose information a reasonable person would expect to have a material effect on the share price (unless an exception applies). This drives trading halts and unscheduled earnings upgrades or downgrades between results.</p></div></details><details class="qa"><summary><span class="chip">Concept</span> What inputs would you typically use for an Australian company's WACC?</summary><div class="rich"><ul><li><strong>rf</strong>: 10-year ACGB yield (check the current yield)</li><li><strong>ERP</strong>: about 6% (common practice; some use 6–7%)</li><li><strong>β</strong>: regressed against the S&amp;P/ASX 200; adjusted β = 0.67 × raw + 0.33</li><li><strong>Kd</strong>: current borrowing cost (base rate + margin), after 30% tax</li><li><strong>Weights</strong>: target or peer-average net debt ÷ EV</li></ul></div></details><details class="qa"><summary><span class="chip">Concept</span> What are the main ways ASX companies raise equity?</summary><div class="rich"><ul><li><strong>Placement</strong>: to institutions, quick; 15% annual capacity under LR 7.1 (plus 10% under 7.1A for eligible small/mid caps); usually priced at a 5–10% discount</li><li><strong>SPP</strong>: lets retail holders buy up to $30,000 at the placement price</li><li><strong>Entitlement offer</strong>: pro-rata to all holders; renounceable (rights tradeable) or not; often accelerated (ANREO/AREO)</li></ul></div></details><details class="qa"><summary><span class="chip">Formula</span> Theoretical ex-rights price (TERP)?</summary><div class="rich"><div class="fx">TERP = (Old shares × Pre-offer price + New shares × Offer price) ÷ (Old shares + New shares)</div><p>The discount to TERP (not to the last price) is the true discount offered in an entitlement offer.</p></div></details><details class="qa"><summary><span class="chip">Concept</span> What is a DRP and what does it do to per-share numbers?</summary><div class="rich"><p>Dividend reinvestment plan: holders take new shares instead of cash, often at a small discount. The company keeps the cash, but the share count rises, diluting EPS and DPS for holders who don't participate. An underwritten DRP is effectively an equity raise.</p></div></details></div></section><section id="s-mac" class="block"><div class="eyebrow">Section</div><h2 style="font-size:24px">Markets &amp; macro</h2><details class="notes-body"><summary><strong>Notes</strong></summary><div class="rich"><h3>Bonds</h3><ul><li>Price and yield move inversely: fixed coupons are worth less when new bonds pay more</li></ul><div class="fx">% price change ≈ − Modified duration × Δ yield</div><ul><li>Credit spread = corporate yield − government yield; spreads widen in stress</li></ul><h3>Yield curve</h3><div class="tw"><table><thead><tr><th>Shape</th><th>Usually signals</th></tr></thead><tbody><tr><td>Normal (upward)</td><td>Expected growth, term premium</td></tr><tr><td>Flat</td><td>Transition, tightening late in a cycle</td></tr><tr><td>Inverted</td><td>Markets expect rate cuts; a recession signal</td></tr></tbody></table></div><h3>RBA</h3><p>The Monetary Policy Board sets the cash rate at 8 meetings a year, targeting 2–3% CPI inflation (aiming for the midpoint).</p><h3>Rates and equity valuations</h3><ul><li>Higher rates → higher rf → higher WACC → lower PV</li><li>Long-duration equities (growth, cash flows far out) fall most</li><li>Bond proxies (REITs, utilities, infrastructure) are rate-sensitive</li><li>Banks can benefit from higher rates through net interest margin, up to a point</li></ul><h3>FX and commodities</h3><div class="tw"><table><thead><tr><th>Driver</th><th>Winners</th><th>Losers</th></tr></thead><tbody><tr><td>Weaker AUD</td><td>Exporters, USD earners (miners, CSL, JHX)</td><td>Importers paying USD (furniture, apparel retailers)</td></tr><tr><td>Higher iron ore</td><td>BHP, RIO, FMG, federal budget</td><td>Steelmakers</td></tr><tr><td>Higher oil</td><td>Energy producers</td><td>Airlines, transport</td></tr></tbody></table></div><div class="fx">Fisher: (1 + nominal) = (1 + real) × (1 + inflation)</div></div></details><h3 style="margin-top:8px">Cards: tap a question to reveal the answer</h3><div><details class="qa"><summary><span class="chip">Concept</span> Why do bond prices fall when yields rise?</summary><div class="rich"><p>A bond's coupons are fixed. When market yields rise, new bonds pay more, so existing bonds must fall in price until their yield to maturity matches the market. Price is the PV of fixed cash flows; a higher discount rate means a lower PV.</p></div></details><details class="qa"><summary><span class="chip">Formula</span> What does modified duration tell you?</summary><div class="rich"><div class="fx">% price change ≈ − Modified duration × Δ yield</div><p>Duration 7, yields up 0.5% → price ≈ −3.5%. Longer maturity and lower coupon → higher duration. Convexity makes the true move slightly better than the estimate.</p></div></details><details class="qa"><summary><span class="chip">Concept</span> What do different yield curve shapes signal?</summary><div class="rich"><ul><li><strong>Normal (upward sloping)</strong>: investors want a term premium; growth expected</li><li><strong>Flat</strong>: transition, often late in a tightening cycle</li><li><strong>Inverted</strong>: short rates above long rates; markets expect cuts; historically a recession signal</li></ul><p>Steepening and flattening trades position for these shifts.</p></div></details><details class="qa"><summary><span class="chip">Concept</span> How does the RBA set monetary policy?</summary><div class="rich"><p>The Monetary Policy Board sets the cash rate target at 8 meetings a year. The mandate: CPI inflation of 2–3% (aiming for the midpoint) and full employment.<br>The cash rate feeds into bank funding costs, mortgage rates, the AUD and asset valuations.</p></div></details><details class="qa"><summary><span class="chip">Concept</span> How do rising interest rates affect equity valuations?</summary><div class="rich"><ul><li>Higher rf → higher cost of equity and WACC → lower PV of future cash flows</li><li><strong>Long-duration</strong> stocks (growth, cash flows far in the future) fall most</li><li><strong>Bond proxies</strong> (REITs, utilities, infrastructure) fall as yields compete</li><li>Higher interest costs hit levered companies; consumer spending slows</li><li>Banks may benefit from wider net interest margins, until bad debts rise</li></ul></div></details><details class="qa"><summary><span class="chip">Concept</span> Which companies do better and worse under high inflation?</summary><div class="rich"><p><strong>Better</strong>: pricing power, real assets with indexed revenue (toll roads, some REITs), low capital intensity, commodity producers.<br><strong>Worse</strong>: input-cost heavy with weak pricing power, fixed-price contracts, long-duration growth stocks (via higher rates), consumer discretionary as real incomes fall.</p></div></details><details class="qa"><summary><span class="chip">Concept</span> How does a weaker AUD affect ASX companies?</summary><div class="rich"><ul><li><strong>Winners</strong>: exporters and USD earners (miners, CSL, James Hardie, Aristocrat), whose foreign earnings are worth more in AUD</li><li><strong>Losers</strong>: importers paying in USD (furniture and apparel retailers like Nick Scali, unless hedged), and companies with USD costs</li></ul><p>Check hedging policies: they delay the effect.</p></div></details><details class="qa"><summary><span class="chip">Concept</span> Which commodity prices matter most for the ASX?</summary><div class="rich"><ul><li><strong>Iron ore</strong>: BHP, Rio Tinto, Fortescue, and the federal budget</li><li><strong>Oil and LNG</strong>: Woodside, Santos; higher oil hurts airlines (Qantas) and transport</li><li><strong>Gold</strong>: Northern Star, Newmont, Evolution</li><li><strong>Copper, lithium</strong>: growth and battery-metal names</li></ul></div></details><details class="qa"><summary><span class="chip">Concept</span> Growth vs value stocks: why do they react differently to rates?</summary><div class="rich"><p>Growth stocks' value sits in cash flows far in the future (high equity duration), so a higher discount rate cuts their PV more. Value stocks earn more of their value now (low duration).<br>So rising rates tend to favour value; falling rates favour growth.</p></div></details><details class="qa"><summary><span class="chip">Formula</span> Real vs nominal rates: the Fisher equation?</summary><div class="rich"><div class="fx">(1 + nominal) = (1 + real) × (1 + inflation)</div><p>≈ nominal − inflation for small numbers. Breakeven inflation = nominal bond yield − inflation-linked bond yield. Keep DCFs consistent: nominal cash flows with nominal WACC.</p></div></details><details class="qa"><summary><span class="chip">Concept</span> What is a credit spread and what does widening signal?</summary><div class="rich"><div class="fx">Credit spread = Corporate bond yield − Government bond yield of same maturity</div><p>Compensation for default and liquidity risk. Widening signals rising perceived risk or stress (often ahead of equity weakness); tightening signals risk appetite.</p></div></details></div></section><section id="s-pit" class="block"><div class="eyebrow">Section</div><h2 style="font-size:24px">Pitching a stock</h2><details class="notes-body"><summary><strong>Notes</strong></summary><div class="rich"><h3>Two-minute pitch structure</h3><ul><li><strong>One line</strong>: what the company does and why it matters now</li><li><strong>Call</strong>: BUY/HOLD/SELL, price target, upside (TSR incl. dividends)</li><li><strong>Thesis</strong>: 2–3 points where you differ from consensus, each with evidence</li><li><strong>Valuation</strong>: method and what is priced in</li><li><strong>Catalysts</strong>: dated events that will show you are right</li><li><strong>Risks</strong>: what would prove you wrong, and how you would know</li></ul><h3>A good catalyst is</h3><ul><li>Specific and dated (results date, AGM, regulatory decision, contract award)</li><li>Observable, and able to move consensus estimates</li><li>Not "the market will eventually realise"</li></ul><h3>Follow-up questions to prepare</h3><ul><li>What is priced in? Who is on the other side of the trade?</li><li>What is the bear case? What would make you sell?</li><li>Why now? What does consensus get wrong?</li><li>What is your biggest risk, and how would you size the position?</li></ul><h3>Ratings (typical bands)</h3><div class="tw"><table><thead><tr><th>Rating</th><th>Expected 12-month TSR</th></tr></thead><tbody><tr><td>BUY</td><td>Above ~15%</td></tr><tr><td>HOLD</td><td>~0–15%</td></tr><tr><td>SELL</td><td>Negative</td></tr></tbody></table></div></div></details><h3 style="margin-top:8px">Cards: tap a question to reveal the answer</h3><div><details class="qa"><summary><span class="chip">Interview</span> What's the structure of a strong two-minute stock pitch?</summary><div class="rich"><ul><li><strong>One line</strong>: what the company does</li><li><strong>Call</strong>: BUY/HOLD/SELL, price target, expected TSR</li><li><strong>Thesis</strong>: 2–3 points where you differ from consensus, with evidence</li><li><strong>Valuation</strong>: method and what is priced in</li><li><strong>Catalysts</strong>: dated events that will prove you right</li><li><strong>Risks</strong>: what would prove you wrong, and how you'd know</li></ul></div></details><details class="qa"><summary><span class="chip">Concept</span> What is a variant view, and why does it matter?</summary><div class="rich"><p>Where your view differs from consensus, and why you're right. If you agree with the market, there is no reason for the price to move.<br>Show it with evidence (channel checks, data, a different read of the numbers) and quantify it: "consensus has X; I have Y because...". A reverse DCF shows what the market is assuming.</p></div></details><details class="qa"><summary><span class="chip">Concept</span> What makes a good catalyst?</summary><div class="rich"><ul><li>Specific and dated (results, investor day, regulatory decision, contract award, capital management)</li><li>Observable: you will know if it happened</li><li>Able to move consensus estimates or the multiple</li></ul><p>"The market will realise it's undervalued" is not a catalyst.</p></div></details><details class="qa"><summary><span class="chip">Concept</span> How should you present risks in a pitch?</summary><div class="rich"><ul><li>Separate <strong>thesis-breaking</strong> risks from noise</li><li>Quantify (e.g. "each 1% of LFL is ~3% of EBIT")</li><li>State what would prove you wrong (a falsification test) and what you'd watch</li><li>Give mitigants, but don't dismiss risks</li></ul></div></details><details class="qa"><summary><span class="chip">Concept</span> How do you set and express a price target?</summary><div class="rich"><p>Usually a 12-month target from a blend of DCF and multiples (e.g. forward P/E or EV/EBIT on next year's earnings).</p><div class="fx">Expected TSR = (Price target ÷ Price − 1) + Dividend yield</div><p>State the method, the key assumption, and the upside.</p></div></details><details class="qa"><summary><span class="chip">Interview</span> How do you defend a HOLD rating in an interview or committee?</summary><div class="rich"><ul><li>Rating bands: e.g. BUY above ~15% TSR, HOLD ~0–15%</li><li>Explain why the business is good but the price is fair, or why the risks balance the upside</li><li>State what would move you to BUY (price level, catalyst, data point)</li><li>For a held position, HOLD can mean "retain": the thesis is intact, just less upside</li></ul></div></details><details class="qa"><summary><span class="chip">Interview</span> What follow-up questions should you prepare for after a pitch?</summary><div class="rich"><ul><li>What is priced in? What does consensus assume?</li><li>What's the bear case, and what's your downside?</li><li>Why now?</li><li>Who is on the other side of the trade?</li><li>What would make you sell?</li><li>How would you size it, and what's the liquidity?</li><li>How good is management, and how are they paid?</li></ul></div></details><details class="qa"><summary><span class="chip">Interview</span> How do you answer "why now?"</summary><div class="rich"><p>Point to timing:</p><ul><li>A near-term catalyst (results, cycle turn, new product)</li><li>A valuation dislocation (sold off on a temporary issue)</li><li>Sentiment or positioning extremes</li><li>An inflection in a key driver showing up in data</li></ul></div></details><details class="qa"><summary><span class="chip">Interview</span> How would you structure a short pitch?</summary><div class="rich"><p>Same structure, flipped: why consensus is too optimistic, the catalyst that will show it, valuation downside.<br>Add short-specific points: borrow availability and cost, short interest (crowding), squeeze risk, and a stop-loss. Unlimited downside means tighter risk management.</p></div></details><details class="qa"><summary><span class="chip">Concept</span> What makes an investment thesis good?</summary><div class="rich"><ul><li>Few drivers (2–3), each quantified</li><li>Differs from consensus (a variant view)</li><li>Falsifiable: clear signs you're wrong</li><li>Backed by evidence, not narrative</li><li>Linked to valuation: if you're right, the stock re-rates by X</li></ul></div></details></div></section></main></noscript>

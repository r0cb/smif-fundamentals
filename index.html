/* ---------------- Accounting traps ---------------- */
{ id: "acc01", s: "acc", t: "concept", q: "What does AASB 16 do to a lessee's financial statements?",
a: `Leases go on balance sheet: a right-of-use asset and a lease liability.
- Rent expense disappears; replaced by ROU depreciation + lease interest
- **EBITDA up** a lot, EBIT up slightly
- **NPAT down** in early years (interest is front-loaded)
- **CFO up**, CFF down (principal in CFF); total cash unchanged
- Net debt up if leases are included` },
{ id: "acc02", s: "acc", t: "interview", q: "How do you compare EV/EBITDA across companies when leases are involved?",
a: `Be consistent:
- **Post-AASB 16**: EBITDA (rent excluded) with EV **including** lease liabilities
- **Pre-AASB 16**: EBITDA after deducting rent with EV **excluding** leases
Never mix. Many ASX retailers report "pre-AASB 16" underlying numbers; EV/EBIT is less distorted.` },
{ id: "acc03", s: "acc", t: "concept", q: "How is share-based payment expense accounted for?",
a: `Measured at grant-date fair value (option pricing model) and expensed over the vesting period, with a credit to the SBP reserve in equity.
Non-cash, so added back in CFO, but it costs shareholders through dilution. Many companies exclude it from "adjusted" earnings; be sceptical.` },
{ id: "acc04", s: "acc", t: "concept", q: "What creates deferred tax liabilities and assets?",
a: `Timing differences between accounting and tax:
- **DTL**: accounting profit > taxable profit now, e.g. tax depreciation faster than accounting depreciation. Tax is deferred
- **DTA**: taxable profit > accounting profit now, e.g. provisions not yet deductible, tax losses carried forward
A large DTA from losses has value only if future profits are likely.` },
{ id: "acc05", s: "acc", t: "concept", q: "How does goodwill work under IFRS/AASB?",
a: `= Goodwill = Price paid − Fair value of net identifiable assets acquired
Not amortised. Tested for impairment at least annually by comparing carrying amount with recoverable amount (value in use or fair value less costs to sell).
Impairments are non-cash, usually not tax-deductible, and signal the acquisition underdelivered.` },
{ id: "acc06", s: "acc", t: "concept", q: "Why watch capitalised costs (software, development)?",
a: `Capitalising moves spending from opex (hits EBITDA now) to an intangible asset (amortised later, below EBITDA). It inflates EBITDA and EBIT in the short term.
Red flags: capitalised amount rising faster than revenue, capitalised ÷ total spend rising, short amortisation lives being lengthened.` },
{ id: "acc07", s: "acc", t: "concept", q: "AASB 15 revenue recognition: the five steps?",
a: `- Identify the contract
- Identify performance obligations
- Determine the transaction price
- Allocate the price to the obligations
- Recognise revenue when (or as) each obligation is satisfied
Deposits received before delivery are contract liabilities, not revenue (e.g. furniture retailers recognise revenue on delivery).` },
{ id: "acc08", s: "acc", t: "concept", q: "Subsidiary vs associate vs investment: how is each accounted for?",
a: `| Ownership | Treatment |
|---|---|
| >50% (control) | Consolidate 100%; show NCI in equity and profit |
| 20–50% (significant influence) | Equity accounting: one line for share of profit, one asset line |
| <20% | Financial asset at fair value |` },
{ id: "acc09", s: "acc", t: "concept", q: "How should you treat \"one-off\" significant items that appear every year?",
a: `As operating costs. If restructuring, impairments or "transformation" costs recur, they are part of running the business. Add them back into underlying earnings, or at least average them, before applying a multiple.` },
{ id: "acc10", s: "acc", t: "concept", q: "How is inventory measured under AASB/IFRS?",
a: `At the **lower of cost and net realisable value**. Cost uses FIFO or weighted average; **LIFO is banned** under IFRS (allowed under US GAAP).
Write-downs to NRV hit COGS and gross margin.` },
{ id: "acc11", s: "acc", t: "concept", q: "What are provisions and how can they be used to manage earnings?",
a: `Liabilities of uncertain timing or amount (warranties, restructuring, make-good, employee leave, legal). Booking one expenses it now; using it later is non-cash.
Risk: over-providing in a bad year ("big bath") and releasing it later to boost profit ("cookie jar"). Watch provision movements in the notes.` },
{ id: "acc12", s: "acc", t: "concept", q: "What should you check when a company reports \"adjusted EBITDA\"?",
a: `- What is excluded: SBC, restructuring, acquisition costs, AASB 16 effects
- Whether exclusions recur
- Whether it reconciles to statutory numbers
- Whether it matches the definition used by consensus and peers
The more adjustments, the more scepticism.` },
{ id: "acc13", s: "acc", t: "concept", q: "What effect do longer useful lives for depreciation have?",
a: `Lower annual depreciation → higher EBIT and NPAT, with no change in cash. Compare D&A ÷ capex and D&A ÷ PP&E over time and with peers; a falling ratio may mean lives are being stretched.` },
{ id: "acc14", s: "acc", t: "concept", q: "List common earnings quality red flags.",
a: `- CFO persistently below NPAT
- Receivable or inventory days rising faster than sales
- Recurring "one-off" items
- Rising capitalisation of costs or lengthening useful lives
- Big provision releases
- Auditor changes, qualified opinions, related-party transactions` },
{ id: "acc15", s: "acc", t: "interview", q: "A company extends the useful life of its assets. Walk through the effect on the statements.",
a: `**IS**: depreciation down → EBIT and PBT up; tax expense up; NPAT up.
**Cash**: no change, because tax depreciation follows tax rules, not accounting lives. The higher tax expense is deferred (DTL up).
**BS**: PP&E higher than otherwise; retained earnings up; DTL up.
Profit up, cash unchanged: a lower-quality earnings boost.` },

/* ---------------- Australia-specific ---------------- */
{ id: "au01", s: "au", t: "concept", q: "How do franking credits work?",
a: `Australia's imputation system: tax a company has paid (30%, or 25% for base-rate entities) is passed to shareholders as franking credits attached to dividends.
Resident shareholders declare the grossed-up dividend and receive the credit as a tax offset (refundable for low-tax investors like super funds in pension phase). Foreign investors generally can't use them.` },
{ id: "au02", s: "au", t: "formula", q: "Franking credit and grossed-up dividend formulas?",
a: `= Franking credit = Dividend × Franking % × t ÷ (1 − t)
= Grossed-up dividend = Dividend + Franking credit
Fully franked 70c → credit 70 × 0.3 ÷ 0.7 = 30c → grossed up 100c.` },
{ id: "au03", s: "au", t: "concept", q: "What does the ASX reporting calendar look like?",
a: `- Most companies have June year-ends: half-year results in **February**, full year in **August** (reporting season)
- December year-ends report full year in February and half year in August
- Appendix 4D / 4E within 2 months of period end; annual report within 3 months
- Many also give AGM trading updates (Oct–Nov), a common time for guidance changes` },
{ id: "au04", s: "au", t: "concept", q: "What is continuous disclosure (ASX Listing Rule 3.1)?",
a: `Listed entities must immediately disclose information a reasonable person would expect to have a material effect on the share price (unless an exception applies). This drives trading halts and unscheduled earnings upgrades or downgrades between results.` },
{ id: "au05", s: "au", t: "concept", q: "What inputs would you typically use for an Australian company's WACC?",
a: `- **rf**: 10-year ACGB yield (check the current yield)
- **ERP**: about 6% (common practice; some use 6–7%)
- **β**: regressed against the S&P/ASX 200; adjusted β = 0.67 × raw + 0.33
- **Kd**: current borrowing cost (base rate + margin), after 30% tax
- **Weights**: target or peer-average net debt ÷ EV` },
{ id: "au06", s: "au", t: "concept", q: "What are the main ways ASX companies raise equity?",
a: `- **Placement**: to institutions, quick; 15% annual capacity under LR 7.1 (plus 10% under 7.1A for eligible small/mid caps); usually priced at a 5–10% discount
- **SPP**: lets retail holders buy up to $30,000 at the placement price
- **Entitlement offer**: pro-rata to all holders; renounceable (rights tradeable) or not; often accelerated (ANREO/AREO)` },
{ id: "au07", s: "au", t: "formula", q: "Theoretical ex-rights price (TERP)?",
a: `= TERP = (Old shares × Pre-offer price + New shares × Offer price) ÷ (Old shares + New shares)
The discount to TERP (not to the last price) is the true discount offered in an entitlement offer.` },
{ id: "au08", s: "au", t: "concept", q: "What is a DRP and what does it do to per-share numbers?",
a: `Dividend reinvestment plan: holders take new shares instead of cash, often at a small discount. The company keeps the cash, but the share count rises, diluting EPS and DPS for holders who don't participate. An underwritten DRP is effectively an equity raise.` },
{ id: "au09", s: "au", t: "drill", g: "franking", q: "Grossed-up dividend yield" },
{ id: "au10", s: "au", t: "drill", g: "terp", q: "TERP for an entitlement offer" },

/* ---------------- Markets & macro ---------------- */
{ id: "mac01", s: "mac", t: "concept", q: "Why do bond prices fall when yields rise?",
a: `A bond's coupons are fixed. When market yields rise, new bonds pay more, so existing bonds must fall in price until their yield to maturity matches the market. Price is the PV of fixed cash flows; a higher discount rate means a lower PV.` },
{ id: "mac02", s: "mac", t: "formula", q: "What does modified duration tell you?",
a: `= % price change ≈ − Modified duration × Δ yield
Duration 7, yields up 0.5% → price ≈ −3.5%. Longer maturity and lower coupon → higher duration. Convexity makes the true move slightly better than the estimate.` },
{ id: "mac03", s: "mac", t: "concept", q: "What do different yield curve shapes signal?",
a: `- **Normal (upward sloping)**: investors want a term premium; growth expected
- **Flat**: transition, often late in a tightening cycle
- **Inverted**: short rates above long rates; markets expect cuts; historically a recession signal
Steepening and flattening trades position for these shifts.` },
{ id: "mac04", s: "mac", t: "concept", q: "How does the RBA set monetary policy?",
a: `The Monetary Policy Board sets the cash rate target at 8 meetings a year. The mandate: CPI inflation of 2–3% (aiming for the midpoint) and full employment.
The cash rate feeds into bank funding costs, mortgage rates, the AUD and asset valuations.` },
{ id: "mac05", s: "mac", t: "concept", q: "How do rising interest rates affect equity valuations?",
a: `- Higher rf → higher cost of equity and WACC → lower PV of future cash flows
- **Long-duration** stocks (growth, cash flows far in the future) fall most
- **Bond proxies** (REITs, utilities, infrastructure) fall as yields compete
- Higher interest costs hit levered companies; consumer spending slows
- Banks may benefit from wider net interest margins, until bad debts rise` },
{ id: "mac06", s: "mac", t: "concept", q: "Which companies do better and worse under high inflation?",
a: `**Better**: pricing power, real assets with indexed revenue (toll roads, some REITs), low capital intensity, commodity producers.
**Worse**: input-cost heavy with weak pricing power, fixed-price contracts, long-duration growth stocks (via higher rates), consumer discretionary as real incomes fall.` },
{ id: "mac07", s: "mac", t: "concept", q: "How does a weaker AUD affect ASX companies?",
a: `- **Winners**: exporters and USD earners (miners, CSL, James Hardie, Aristocrat), whose foreign earnings are worth more in AUD
- **Losers**: importers paying in USD (furniture and apparel retailers like Nick Scali, unless hedged), and companies with USD costs
Check hedging policies: they delay the effect.` },
{ id: "mac08", s: "mac", t: "concept", q: "Which commodity prices matter most for the ASX?",
a: `- **Iron ore**: BHP, Rio Tinto, Fortescue, and the federal budget
- **Oil and LNG**: Woodside, Santos; higher oil hurts airlines (Qantas) and transport
- **Gold**: Northern Star, Newmont, Evolution
- **Copper, lithium**: growth and battery-metal names` },
{ id: "mac09", s: "mac", t: "concept", q: "Growth vs value stocks: why do they react differently to rates?",
a: `Growth stocks' value sits in cash flows far in the future (high equity duration), so a higher discount rate cuts their PV more. Value stocks earn more of their value now (low duration).
So rising rates tend to favour value; falling rates favour growth.` },
{ id: "mac10", s: "mac", t: "formula", q: "Real vs nominal rates: the Fisher equation?",
a: `= (1 + nominal) = (1 + real) × (1 + inflation)
≈ nominal − inflation for small numbers. Breakeven inflation = nominal bond yield − inflation-linked bond yield. Keep DCFs consistent: nominal cash flows with nominal WACC.` },
{ id: "mac11", s: "mac", t: "concept", q: "What is a credit spread and what does widening signal?",
a: `= Credit spread = Corporate bond yield − Government bond yield of same maturity
Compensation for default and liquidity risk. Widening signals rising perceived risk or stress (often ahead of equity weakness); tightening signals risk appetite.` },
{ id: "mac12", s: "mac", t: "drill", g: "duration", q: "Bond price change from duration" },

/* ---------------- Pitching a stock ---------------- */
{ id: "pit01", s: "pit", t: "interview", q: "What's the structure of a strong two-minute stock pitch?",
a: `- **One line**: what the company does
- **Call**: BUY/HOLD/SELL, price target, expected TSR
- **Thesis**: 2–3 points where you differ from consensus, with evidence
- **Valuation**: method and what is priced in
- **Catalysts**: dated events that will prove you right
- **Risks**: what would prove you wrong, and how you'd know` },
{ id: "pit02", s: "pit", t: "concept", q: "What is a variant view, and why does it matter?",
a: `Where your view differs from consensus, and why you're right. If you agree with the market, there is no reason for the price to move.
Show it with evidence (channel checks, data, a different read of the numbers) and quantify it: "consensus has X; I have Y because...". A reverse DCF shows what the market is assuming.` },
{ id: "pit03", s: "pit", t: "concept", q: "What makes a good catalyst?",
a: `- Specific and dated (results, investor day, regulatory decision, contract award, capital management)
- Observable: you will know if it happened
- Able to move consensus estimates or the multiple
"The market will realise it's undervalued" is not a catalyst.` },
{ id: "pit04", s: "pit", t: "concept", q: "How should you present risks in a pitch?",
a: `- Separate **thesis-breaking** risks from noise
- Quantify (e.g. "each 1% of LFL is ~3% of EBIT")
- State what would prove you wrong (a falsification test) and what you'd watch
- Give mitigants, but don't dismiss risks` },
{ id: "pit05", s: "pit", t: "concept", q: "How do you set and express a price target?",
a: `Usually a 12-month target from a blend of DCF and multiples (e.g. forward P/E or EV/EBIT on next year's earnings).
= Expected TSR = (Price target ÷ Price − 1) + Dividend yield
State the method, the key assumption, and the upside.` },
{ id: "pit06", s: "pit", t: "interview", q: "How do you defend a HOLD rating in an interview or committee?",
a: `- Rating bands: e.g. BUY above ~15% TSR, HOLD ~0–15%
- Explain why the business is good but the price is fair, or why the risks balance the upside
- State what would move you to BUY (price level, catalyst, data point)
- For a held position, HOLD can mean "retain": the thesis is intact, just less upside` },
{ id: "pit07", s: "pit", t: "interview", q: "What follow-up questions should you prepare for after a pitch?",
a: `- What is priced in? What does consensus assume?
- What's the bear case, and what's your downside?
- Why now?
- Who is on the other side of the trade?
- What would make you sell?
- How would you size it, and what's the liquidity?
- How good is management, and how are they paid?` },
{ id: "pit08", s: "pit", t: "interview", q: "How do you answer \"why now?\"",
a: `Point to timing:
- A near-term catalyst (results, cycle turn, new product)
- A valuation dislocation (sold off on a temporary issue)
- Sentiment or positioning extremes
- An inflection in a key driver showing up in data` },
{ id: "pit09", s: "pit", t: "interview", q: "How would you structure a short pitch?",
a: `Same structure, flipped: why consensus is too optimistic, the catalyst that will show it, valuation downside.
Add short-specific points: borrow availability and cost, short interest (crowding), squeeze risk, and a stop-loss. Unlimited downside means tighter risk management.` },
{ id: "pit10", s: "pit", t: "concept", q: "What makes an investment thesis good?",
a: `- Few drivers (2–3), each quantified
- Differs from consensus (a variant view)
- Falsifiable: clear signs you're wrong
- Backed by evidence, not narrative
- Linked to valuation: if you're right, the stock re-rates by X` }
]
};

</script>
<script>
/* SMIF Fundamentals: randomised numeric drills.
   Each generator returns { q: html, ans: number, unit: "$m" | "%" | "x" | "$" | "c" | "m" | "days",
   tol: absolute tolerance, work: html }. Answers within max(tol, 1% of answer) count as correct. */
(function () {
  const R = (min, max, step = 1) => min + step * Math.floor(Math.random() * (Math.floor((max - min) / step) + 1));
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const fmt = (v, dp = 0) => {
    const s = Math.abs(v).toLocaleString("en-AU", { minimumFractionDigits: dp, maximumFractionDigits: dp });
    return v < 0 ? "(" + s + ")" : s;
  };
  const tbl = rows => '<table class="stmt">' + rows.map(([l, v, cls]) =>
    `<tr${cls ? ` class="${cls}"` : ""}><td>${l}</td><td>${v}</td></tr>`).join("") + "</table>";
  const fx = s => `<div class="fx">${s}</div>`;
  const p = s => `<p>${s}</p>`;

  const G = {
    fcffEbit: { title: "FCFF from EBIT", gen() {
      const ebit = R(200, 800, 10), t = 30, da = Math.round(ebit * R(15, 35) / 100);
      const capex = Math.round(da * R(100, 160) / 100), dnwc = R(-20, 40, 5);
      const ans = ebit * 0.7 + da - capex - dnwc;
      return { unit: "$m", tol: 1,
        q: p("Calculate FCFF (A$m). Tax rate 30%.") + tbl([["EBIT", fmt(ebit)], ["D&A", fmt(da)], ["Capex", fmt(capex)],
          [dnwc >= 0 ? "Increase in NWC" : "Decrease in NWC", fmt(Math.abs(dnwc))]]),
        ans, work: fx("FCFF = EBIT × (1 − t) + D&A − Capex − ΔNWC") +
          p(`= ${fmt(ebit)} × 0.7 + ${da} − ${capex} − ${dnwc < 0 ? "(" + dnwc + ")" : dnwc}`) +
          p(`= ${fmt(ebit * 0.7, 1)} + ${da} − ${capex} ${dnwc >= 0 ? "−" : "+"} ${Math.abs(dnwc)} = <b>${fmt(ans, 1)}</b>`) };
    }},
    fcfeNi: { title: "FCFE from NPAT", gen() {
      const ni = R(100, 500, 5), da = R(30, 150, 5), capex = R(40, 200, 5), dnwc = R(-15, 30, 5), nb = R(-60, 80, 10);
      const ans = ni + da - capex - dnwc + nb;
      return { unit: "$m", tol: 1,
        q: p("Calculate FCFE (A$m).") + tbl([["NPAT", fmt(ni)], ["D&A", fmt(da)], ["Capex", fmt(capex)],
          [dnwc >= 0 ? "Increase in NWC" : "Decrease in NWC", fmt(Math.abs(dnwc))],
          [nb >= 0 ? "Net debt drawn" : "Net debt repaid", fmt(Math.abs(nb))]]),
        ans, work: fx("FCFE = NPAT + D&A − Capex − ΔNWC + Net borrowing") +
          p(`= ${ni} + ${da} − ${capex} ${dnwc >= 0 ? "−" : "+"} ${Math.abs(dnwc)} ${nb >= 0 ? "+" : "−"} ${Math.abs(nb)} = <b>${fmt(ans)}</b>`) };
    }},
    fcffCfo: { title: "FCFF from CFO", gen() {
      const cfo = R(200, 900, 10), int = R(10, 60, 2), capex = R(60, 300, 10);
      const ans = cfo + int * 0.7 - capex;
      return { unit: "$m", tol: 1,
        q: p("Calculate FCFF (A$m). Interest paid is classified in CFO. Tax rate 30%.") +
          tbl([["Cash flow from operations", fmt(cfo)], ["Interest paid (in CFO)", fmt(int)], ["Capex", fmt(capex)]]),
        ans, work: fx("FCFF = CFO + Interest paid × (1 − t) − Capex") +
          p(`= ${cfo} + ${int} × 0.7 − ${capex} = ${cfo} + ${fmt(int * 0.7, 1)} − ${capex} = <b>${fmt(ans, 1)}</b>`) +
          p("Add back after-tax interest because FCFF is before payments to lenders.") };
    }},
    nwc: { title: "Working capital cash impact", gen() {
      const ar0 = R(80, 200, 5), inv0 = R(100, 300, 5), ap0 = R(60, 200, 5), cl0 = R(20, 120, 5);
      const ar1 = ar0 + R(-20, 30, 5), inv1 = inv0 + R(-25, 40, 5), ap1 = ap0 + R(-20, 30, 5), cl1 = cl0 + R(-15, 25, 5);
      const ans = -(ar1 - ar0) - (inv1 - inv0) + (ap1 - ap0) + (cl1 - cl0);
      const t = '<table class="stmt"><tr class="h"><td></td><td>Opening</td><td>Closing</td></tr>' +
        [["Receivables", ar0, ar1], ["Inventory", inv0, inv1], ["Payables", ap0, ap1], ["Customer deposits", cl0, cl1]]
          .map(([l, a, b]) => `<tr><td>${l}</td><td>${a}</td><td>${b}</td></tr>`).join("") + "</table>";
      const sg = v => (v >= 0 ? "+" : "−") + Math.abs(v);
      return { unit: "$m", tol: 0.5,
        q: p("What is the cash flow impact of working capital movements (A$m)? Enter an outflow as a negative number.") + t,
        ans, work: p("Assets up use cash; liabilities up free cash.") +
          tbl([["Receivables", sg(-(ar1 - ar0))], ["Inventory", sg(-(inv1 - inv0))], ["Payables", sg(ap1 - ap0)],
            ["Customer deposits", sg(cl1 - cl0)], ["Cash impact", "<b>" + sg(ans) + "</b>", "tot"]]) };
    }},
    cfo: { title: "CFO from EBITDA", gen() {
      const ebitda = R(150, 600, 10), dnwc = R(-20, 40, 5), tax = Math.round(ebitda * R(12, 20) / 100), int = R(5, 40, 1);
      const ans = ebitda - dnwc - tax - int;
      return { unit: "$m", tol: 0.5,
        q: p("Estimate cash flow from operations (A$m). Interest is classified in CFO; there are no other non-cash items.") +
          tbl([["EBITDA", fmt(ebitda)], [dnwc >= 0 ? "Increase in NWC" : "Decrease in NWC", fmt(Math.abs(dnwc))],
            ["Tax paid", fmt(tax)], ["Interest paid", fmt(int)]]),
        ans, work: fx("CFO = EBITDA − ΔNWC − Tax paid − Interest paid") +
          p(`= ${ebitda} ${dnwc >= 0 ? "−" : "+"} ${Math.abs(dnwc)} − ${tax} − ${int} = <b>${fmt(ans)}</b>`) +
          p(`Cash conversion (CFO ÷ EBITDA) = ${fmt(ans / ebitda * 100, 1)}%`) };
    }},
    evBridge: { title: "EV bridge", gen() {
      const px = R(200, 4000, 5) / 100, sh = R(50, 500, 5), debt = R(50, 900, 10), cash = R(20, 300, 10);
      const nci = pick([0, R(10, 80, 5)]), assoc = pick([0, R(10, 120, 5)]), lease = R(50, 400, 10);
      const mcap = px * sh, ans = mcap + debt + lease + nci - cash - assoc;
      return { unit: "$m", tol: 1,
        q: p("Calculate enterprise value (A$m). The multiple will use post-AASB 16 EBITDA.") +
          tbl([["Share price", "$" + px.toFixed(2)], ["Diluted shares (m)", fmt(sh)], ["Borrowings", fmt(debt)], ["Lease liabilities", fmt(lease)],
            ["Cash", fmt(cash)], ["Non-controlling interests", fmt(nci)], ["Investments in associates", fmt(assoc)]]),
        ans, work: fx("EV = Equity value + Debt + Leases + NCI − Cash − Associates") +
          p(`Equity value = ${px.toFixed(2)} × ${sh} = ${fmt(mcap, 1)}`) +
          p(`EV = ${fmt(mcap, 1)} + ${debt} + ${lease} + ${nci} − ${cash} − ${assoc} = <b>${fmt(ans, 1)}</b>`) +
          p("Leases are included because post-AASB 16 EBITDA excludes rent.") };
    }},
    equityFromEv: { title: "Equity value per share", gen() {
      const ebitda = R(80, 400, 5), mult = R(60, 140, 5) / 10, nd = R(-50, 400, 10), nci = pick([0, R(10, 60, 5)]), sh = R(50, 300, 5);
      const ev = ebitda * mult, eq = ev - nd - nci, ans = eq / sh;
      return { unit: "$", tol: 0.02,
        q: p("Peers trade on the EV/EBITDA multiple below. What is the implied value per share?") +
          tbl([["EBITDA (A$m)", fmt(ebitda)], ["Peer EV/EBITDA", mult.toFixed(1) + "x"], [nd >= 0 ? "Net debt (A$m)" : "Net cash (A$m)", fmt(Math.abs(nd))],
            ["Non-controlling interests (A$m)", fmt(nci)], ["Diluted shares (m)", fmt(sh)]]),
        ans, work: p(`EV = ${ebitda} × ${mult.toFixed(1)} = ${fmt(ev, 1)}`) +
          p(`Equity value = ${fmt(ev, 1)} ${nd >= 0 ? "−" : "+"} ${Math.abs(nd)} − ${nci} = ${fmt(eq, 1)}`) +
          p(`Per share = ${fmt(eq, 1)} ÷ ${sh} = <b>$${ans.toFixed(2)}</b>`) };
    }},
    tsm: { title: "Treasury stock method", gen() {
      const P = R(500, 3000, 25) / 100, basic = R(100, 400, 5);
      const n1 = R(2, 12), k1 = Math.round(P * R(40, 90)) / 100, n2 = R(1, 8), k2 = Math.round(P * R(70, 130)) / 100;
      const net = o => (o.k < P ? o.n * (1 - o.k / P) : 0);
      const ans = net({ n: n1, k: k1 }) + net({ n: n2, k: k2 });
      return { unit: "m", tol: 0.02,
        q: p(`Share price $${P.toFixed(2)}, ${basic}m basic shares. How many <b>net new shares</b> (m) does the treasury stock method add?`) +
          tbl([["Tranche A options (m)", n1 + " @ $" + k1.toFixed(2)], ["Tranche B options (m)", n2 + " @ $" + k2.toFixed(2)]]),
        ans, work: fx("Net new shares = Options × (1 − Strike ÷ Price), only if Strike < Price") +
          p(`A: ${k1 < P ? `${n1} × (1 − ${k1.toFixed(2)} ÷ ${P.toFixed(2)}) = ${net({ n: n1, k: k1 }).toFixed(2)}` : "out of the money → 0"}`) +
          p(`B: ${k2 < P ? `${n2} × (1 − ${k2.toFixed(2)} ÷ ${P.toFixed(2)}) = ${net({ n: n2, k: k2 }).toFixed(2)}` : "out of the money → 0"}`) +
          p(`Net new shares = <b>${ans.toFixed(2)}m</b> → diluted shares ${(basic + ans).toFixed(2)}m`) };
    }},
    impliedPe: { title: "Implied P/E", gen() {
      const ev = R(500, 5000, 50), nd = R(-100, 1200, 50), ni = R(30, 400, 5), mcap = ev - nd;
      if (mcap <= ni * 3) return G.impliedPe.gen();
      const ans = mcap / ni;
      return { unit: "x", tol: 0.1,
        q: p("What P/E is the company trading on?") + tbl([["Enterprise value (A$m)", fmt(ev)],
          [nd >= 0 ? "Net debt (A$m)" : "Net cash (A$m)", fmt(Math.abs(nd))], ["NPAT (A$m)", fmt(ni)]]),

    priceFromMultiple: { title: "Implied price from EV/EBITDA", gen() {

          tbl([["Forward EBITDA (A$m)", fmt(ebitda)], ["Peer median EV/EBITDA", m.toFixed(1) + "x"], ["Net debt (A$m)", fmt(nd)], ["Diluted shares (m)", fmt(sh)]]),
        ans, work: p(`EV = ${ebitda} × ${m.toFixed(1)} = ${fmt(ebitda * m, 1)}`) +
          p(`Equity = ${fmt(ebitda * m, 1)} − ${nd} = ${fmt(ebitda * m - nd, 1)}`) + p(`Price = ÷ ${sh} = <b>$${ans.toFixed(2)}</b>`) };

    peg: { title: "PEG ratio", gen() {

        ans, work: p(`P/E = ${px.toFixed(2)} ÷ ${eps.toFixed(2)} = ${pe.toFixed(1)}x`) +

    fcfYield: { title: "FCF yield", gen() {

    calendarise: { title: "Calendarise", gen() {

    beta: { title: "Unlever / relever beta", gen() {

          ans, work: fx("βu = βL ÷ [1 + (1 − t) × D/E]") + p(`= ${bl.toFixed(2)} ÷ (1 + 0.7 × ${de.toFixed(2)}) = <b>${ans.toFixed(3)}</b>`) };
      }

    lbo: { title: "LBO IRR", gen() {

    pv: { title: "Present value", gen() {

    }},
    accretion: { title: "Accretion / dilution", gen() {

            ["Target NPAT (A$m)", fmt(nt)], ["Equity purchase price (A$m)", fmt(price)]]),
        ans, work: p(`Acquirer P/E = ${pea.toFixed(1)}x; P/E paid = ${price} ÷ ${nt} = ${pet.toFixed(1)}x → expect ${pea > pet ? "accretion" : pea < pet ? "dilution" : "neutral"}`) +
          p(`New shares = ${price} ÷ ${pa.toFixed(2)} = ${newSh.toFixed(1)}m`) +
          p(`Standalone EPS = ${fmt(na, 1)} ÷ ${sa} = $${eps0.toFixed(3)}`) +
          p(`Pro forma EPS = (${fmt(na, 1)} + ${nt}) ÷ (${sa} + ${newSh.toFixed(1)}) = $${eps1.toFixed(3)}`) +
          p(`Accretion = <b>${ans >= 0 ? "+" : ""}${ans.toFixed(2)}%</b>`) };
    }},
    dupont: { title: "DuPont ROE", gen() {
      const rev = R(500, 3000, 50), m = R(4, 15), at = R(60, 200, 10) / 100, em = R(130, 300, 10) / 100;
      const ni = rev * m / 100, assets = rev / at, eq = assets / em, ans = ni / eq * 100;
      return { unit: "%", tol: 0.1,

        ans, work: fx("ROE = Margin × Asset turnover × Equity multiplier") +
          p(`= ${m.toFixed(1)}% × ${at.toFixed(2)}x × ${em.toFixed(2)}x = <b>${ans.toFixed(1)}%</b>`) +
          p(`Check: ${fmt(ni, 1)} ÷ ${fmt(eq, 1)} = ${ans.toFixed(1)}%`) };
    }},
    ccc: { title: "Cash conversion cycle", gen() {
      const rev = R(400, 2000, 20), cogs = Math.round(rev * R(40, 70) / 100);
      const ar = Math.round(rev * R(2, 15) / 100), inv = Math.round(cogs * R(10, 35) / 100), ap = Math.round(cogs * R(8, 25) / 100);
      const dso = ar / rev * 365, dio = inv / cogs * 365, dpo = ap / cogs * 365, ans = dso + dio - dpo;
      return { unit: "days", tol: 1,
        q: p("Calculate the cash conversion cycle (days). Use 365 days.") +
          tbl([["Revenue (A$m)", fmt(rev)], ["COGS (A$m)", fmt(cogs)], ["Receivables", fmt(ar)], ["Inventory", fmt(inv)], ["Payables", fmt(ap)]]),
        ans, work: p(`DSO = ${ar} ÷ ${rev} × 365 = ${dso.toFixed(1)}`) + p(`DIO = ${inv} ÷ ${cogs} × 365 = ${dio.toFixed(1)}`) +
          p(`DPO = ${ap} ÷ ${cogs} × 365 = ${dpo.toFixed(1)}`) + fx("CCC = DSO + DIO − DPO") + p(`= <b>${ans.toFixed(1)} days</b>`) };
    }},
    roic: { title: "ROIC", gen() {
      const ebit = R(50, 400, 5), nwc = R(-50, 200, 10), ppe = R(200, 1500, 50), gw = R(0, 600, 50);

        ans, work: fx("ROIC = EBIT × (1 − t) ÷ (NWC + PP&E + Intangibles)") +
          p(`NOPAT = ${fmt(ebit * 0.7, 1)}; IC = ${nwc} + ${ppe} + ${gw} = ${ic}`) + p(`ROIC = <b>${ans.toFixed(1)}%</b>`) };
    }},
    leverage: { title: "Net debt / EBITDA", gen() {
      const ebitda = R(80, 600, 10), debt = R(100, 2000, 25), cash = R(20, 400, 10), int = Math.round(debt * R(5, 7) / 100);
      const ebit = Math.round(ebitda * R(55, 80) / 100), ans = (debt - cash) / ebitda;

        ans, work: p(`Net debt = ${debt} − ${cash} = ${debt - cash}`) + p(`Net debt / EBITDA = ${debt - cash} ÷ ${ebitda} = <b>${ans.toFixed(2)}x</b>`) +
          p(`Interest cover = EBIT ÷ interest = ${ebit} ÷ ${int} = ${(ebit / int).toFixed(1)}x`) };
    }},
    dol: { title: "Operating leverage", gen() {

      if (g === 0) return G.dol.gen();

          tbl([["Share price", "$" + px.toFixed(2)], ["Dividend per share", dps.toFixed(1) + "c"], ["Franking", f + "%"]]),
        ans, work: fx("Franking credit = DPS × Franking % × 0.3 ÷ 0.7") +
          p(`= ${dps.toFixed(1)} × ${f / 100} × 0.4286 = ${credit.toFixed(2)}c`) +
          p(`Grossed-up yield = (${dps.toFixed(1)} + ${credit.toFixed(2)})c ÷ ${(px * 100).toFixed(0)}c = <b>${ans.toFixed(2)}%</b> (cash yield ${(dps / px).toFixed(2)}%)`) };
    }},
    terp: { title: "TERP", gen() {
      const px = R(100, 3000, 5) / 100, ratio = pick([3, 4, 5, 6, 8, 10]), disc = R(8, 25), offer = Math.round(px * (100 - disc)) / 100;
      const ans = (ratio * px + offer) / (ratio + 1);
      return { unit: "$", tol: 0.01,
        q: p(`A 1-for-${ratio} entitlement offer is priced at $${offer.toFixed(2)}. The last close was $${px.toFixed(2)}. What is the TERP?`),
        ans, work: fx("TERP = (Old × Price + New × Offer) ÷ (Old + New)") +
          p(`= (${ratio} × ${px.toFixed(2)} + 1 × ${offer.toFixed(2)}) ÷ ${ratio + 1} = <b>$${ans.toFixed(3)}</b>`) +
          p(`Discount to TERP = ${((1 - offer / ans) * 100).toFixed(1)}% (vs ${disc}% to last close)`) };
    }},
    duration: { title: "Duration", gen() {
      const d = R(20, 120, 5) / 10, bp = pick([-100, -75, -50, -25, 25, 50, 75, 100]);
      const ans = -d * bp / 100;

        q: p(`A bond has a modified duration of ${d.toFixed(1)}. Yields move ${bp > 0 ? "up" : "down"} ${Math.abs(bp)}bp. Approximate % price change?`),
        ans, work: fx("% ΔP ≈ − Modified duration × Δy") + p(`= −${d.toFixed(1)} × ${(bp / 100).toFixed(2)}% = <b>${ans >= 0 ? "+" : ""}${ans.toFixed(2)}%</b>`) };
    }}
  };
  window.DRILLS = G;
})();

    for (const [id, st] of Object.entries(other.cards || {})) if ((st.last || 0) > base.resetAt && (!out.cards[id] || st.last > out.cards[id].last)) out.cards[id] = st;
    out.notes = mergeNotes(base.notes, other.notes);
    return out;
  }
  const out = blank(); out.resetAt = a.resetAt || 0;
  for (const id of new Set([...Object.keys(a.cards || {}), ...Object.keys(b.cards || {})])) {
    const x = a.cards?.[id], y = b.cards?.[id];

  }
  for (const k of new Set([...Object.keys(a.days || {}), ...Object.keys(b.days || {})])) {
    const x = a.days?.[k] || {}, y = b.days?.[k] || {};
    out.days[k] = { r: Math.max(x.r || 0, y.r || 0), n: Math.max(x.n || 0, y.n || 0), q: Math.max(x.q || 0, y.q || 0), ok: Math.max(x.ok || 0, y.ok || 0) };
  }
  const newer = (b.settingsAt || 0) > (a.settingsAt || 0) ? b : a;
  out.settings = Object.assign(blank().settings, newer.settings); out.settingsAt = newer.settingsAt || 0;

/* ---------- sync (db capability, per-viewer private doc) ---------- */
let ref = null, pushTimer = null, pushing = false, pushAgain = false, sync = "local";
function setSync(s) { sync = s; const el = $("#sync"); if (el) el.outerHTML = syncHtml(); }
function syncHtml() {
  const m = { local: ["", "Saved on this device"], busy: ["busy", "Saving…"], ok: ["ok", "Synced to your account"], err: ["err", "Couldn't sync; saved on this device"] }[sync];
  return `<span class="sync ${m[0]}" id="sync"><i></i>${m[1]}</span>`;
}
function saveLocal() { try { localStorage.setItem(LS, JSON.stringify(P)); } catch (e) {} }
function persist() { saveLocal(); if (!ref) return; clearTimeout(pushTimer); pushTimer = setTimeout(push, 1500); }
async function push() {
  pushTimer = null; if (!ref) return;
  if (pushing) { pushAgain = true; return; }
  pushing = true; setSync("busy");
  try { await ref.set({ p: JSON.parse(JSON.stringify(P)), at: Date.now() }); setSync("ok"); }
  catch (e) {
    setSync("err");
    if (e && (e.code === "unavailable" || e.code === "resource_exhausted")) setTimeout(persist, 3000 + Math.random() * 3000);
  }

}
async function pull() {
  if (!ref) return;
  try {
    const snap = await ref.get();
    const remote = snap.exists ? JSON.parse(JSON.stringify(snap.data().p || null)) : null;
    const before = JSON.stringify(P);
    if (remote) P = merge(P, Object.assign(blank(), remote));
    saveLocal();
    if (!remote || JSON.stringify(remote) !== JSON.stringify(P)) await push(); else setSync("ok");
    if (JSON.stringify(P) !== before && view === "today") render();
  } catch (e) { setSync("err"); }
}
async function initSync() {
  try {

    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return;
    const uid = await user.id(); if (!uid) return;
    ref = db.doc("data/users/" + uid + "/srs");
    await pull();
  } catch (e) { setSync("local"); }
}
document.addEventListener("visibilitychange", () => {

  else if (!S) pull();

/* ---------- scheduling (SM-2 style) ---------- */
function nextState(prev, r, today, fuzz) {
  const s = prev ? { ...prev } : { ivl: 0, ease: 2.5, reps: 0, lapses: 0, intro: today };
  if (r === 1) { if (s.reps > 0) s.lapses++; s.reps = 0; s.ivl = 0; s.ease = Math.max(1.3, s.ease - 0.2); s.due = today; s.last = Date.now(); return s; }
  let ivl;
  if (r === 2) { ivl = s.reps === 0 ? 1 : Math.max(s.ivl + 1, Math.round(s.ivl * 1.2)); s.ease = Math.max(1.3, s.ease - 0.15); }
  if (r === 3) { ivl = s.reps === 0 ? 1 : s.reps === 1 ? 3 : Math.max(s.ivl + 1, Math.round(s.ivl * s.ease)); }
  if (r === 4) { ivl = s.reps === 0 ? 4 : s.reps === 1 ? 6 : Math.max(s.ivl + 2, Math.round(s.ivl * s.ease * 1.3)); s.ease += 0.15; }
  if (fuzz && ivl >= 4) ivl = Math.round(ivl * (0.95 + Math.random() * 0.1));
  s.ivl = Math.min(365, ivl); s.reps++; s.due = today + s.ivl; s.last = Date.now();
  return s;
}
function newOrder() {
  const from = P.settings.newFrom;
  const groups = SECTIONS.filter(s => from === "all" || s.id === from).map(s => CARDS.filter(c => c.s === s.id).map(c => c.id));
  const out = []; for (let k = 0; groups.some(g => k < g.length); k++) for (const g of groups) if (k < g.length) out.push(g[k]);
  return out;
}
function todayStats() {
  const today = dayNum(), st = P.cards;
  const due = CARDS.filter(c => st[c.id] && st[c.id].due <= today).length;
  const introToday = Object.values(st).filter(x => x.intro === today).length;
  const unseen = newOrder().filter(id => !st[id]).length;
  const fresh = Math.min(unseen, Math.max(0, P.settings.newPerDay - introToday));
  return { due, fresh, unseen, introToday };
}
function buildQueue(extraNew = 0) {
  const today = dayNum(), st = P.cards;
  const due = shuffle(CARDS.filter(c => st[c.id] && st[c.id].due <= today).map(c => c.id)).sort((a, b) => st[a].due - st[b].due);
  const { fresh } = todayStats();
  const news = newOrder().filter(id => !st[id]).slice(0, extraNew || fresh);
  const q = []; let ni = 0;
  due.forEach((id, k) => { q.push(id); if ((k + 1) % 3 === 0 && ni < news.length) q.push(news[ni++]); });
  while (ni < news.length) q.push(news[ni++]);
  return q;
}
function streak() {
  let n = 0, d = dayNum(); if (!(P.days[dayKey(d)]?.r > 0)) d--;
  while (P.days[dayKey(d)]?.r > 0) { n++; d--; }
  return n;
}

/* ---------- study session ---------- */
function startSession(mode, queue, label) {

  S = { mode, queue, i: 0, done: 0, total: queue.length, label, revealed: false, inst: null, check: null, choice: null, input: "", t0: Date.now(), right: 0, asked: 0, timer: null };

function prepCard() {

  S.inst = c.t === "drill" ? DRILLS[c.g].gen() : null;
  clearInterval(S.timer); S.timer = null;

}
const elapsed = () => { const s = Math.floor((Date.now() - S.shownAt) / 1000); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
function endSession() { clearInterval(S?.timer); }

      <div class="where">${WHERE.map(([k, l]) => `<button data-w="${k}" ${S.revealed ? "disabled" : ""} class="${S.revealed ? (k === c.w ? "right" : k === S.choice ? "wrong" : "") : ""}">${l}<small>${k}</small></button>`).join("")}</div>
      ${S.revealed ? `<div class="ans rich">${md(c.a)}</div>` : ""}`;
  } else {

      ${c.t === "interview" && !S.revealed ? `<div class="hint">Answer out loud first, then compare. <span class="timer" id="timer">${elapsed()}</span></div>` : ""}

  } else if (S.mode === "srs") {

      `<button class="r${r} ${sug === r ? "suggest" : ""}" data-r="${r}">${l}<small>${r === 1 ? "<10m" : fmtIvl(nextState(st, r, today, false).ivl)}</small></button>`).join("")}</div><div class="kbd">1 · 2 · 3 · 4</div>`;
  } else {
    actions = `<div class="rate" style="grid-template-columns:1fr 1fr"><button class="r1" data-r="1">Again<small>repeat later</small></button><button class="r3" data-r="3">Next<small>got it</small></button></div><div class="kbd">1 · 3</div>`;

}
function fmtAns(I) {
  const dp = I.unit === "$" ? 2 : I.unit === "x" || I.unit === "%" || I.unit === "m" ? 2 : 1;
  const v = I.ans.toLocaleString("en-AU", { minimumFractionDigits: 0, maximumFractionDigits: dp });
  return `<span class="mono">${I.unit === "$" ? "$" + v : v + (I.unit === "$m" ? " (A$m)" : I.unit === "days" ? " days" : I.unit)}</span>`;
}
function parseNum(s) {

  S.done++; S.i++; prepCard(); renderStudy(); window.scrollTo(0, 0);
}
function renderDone() {
  endSession();

  const { due, fresh } = todayStats();
  app.innerHTML = `<section class="done">

document.addEventListener("keydown", e => {

/* ---------- notes ---------- */
function cardPlain(c) { return c.t === "drill" ? "Numeric drill: " + DRILLS[c.g].title : c.q.replace(/\*\*/g, ""); }

      <div class="notes-body rich">${md(s.notes)}</div></div>
      <div class="block"><div class="row" style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><h2>My notes on this section</h2><button class="btn" id="addnote">Add a note</button></div>
      ${(() => { const mine = notesList().filter(n => n.sec === s.id); return mine.length ? `<div class="nlist" style="margin-top:0">${mine.map(noteItem).join("")}</div>` : `<p class="muted" style="margin:0">None yet. Notes you tag with this section appear here.</p>`; })()}</div>
      <div class="block"><div class="row" style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><h2>Cards (${cs.length})</h2><button class="btn" id="cram">Practise this section</button></div>
      <div>${cs.map(c => qaHtml(c, "")).join("")}</div></div>`;
    $("#addnote").addEventListener("click", () => newNote(s.id));
    app.querySelectorAll("[data-note]").forEach(b => b.addEventListener("click", () => openNote(b.dataset.note)));
    $("#back").addEventListener("click", () => { notesSec = null; renderNotes(); window.scrollTo(0, 0); });
    $("#cram").addEventListener("click", () => startSession("cram", shuffle(cs.map(c => c.id)), s.title));
  } else {
    let results = "";
    if (q) {
      const lq = q.toLowerCase();
      const hits = CARDS.filter(c => (cardPlain(c) + " " + (c.a || "")).toLowerCase().includes(lq));
      const nhits = SECTIONS.filter(s => s.notes.toLowerCase().includes(lq));
      results = `<div class="block"><h2>${hits.length} card${hits.length === 1 ? "" : "s"} match “${esc(q)}”</h2>
        ${nhits.length ? `<p class="muted">Also in the notes for: ${nhits.map(s => `<button class="link" data-sec="${s.id}">${esc(s.title)}</button>`).join(", ")}</p>` : ""}
        <div>${hits.slice(0, 40).map(c => qaHtml(c, q)).join("")}</div></div>`;
    }
    app.innerHTML = `<div class="block" style="margin-top:0"><label class="eyebrow" for="search">Search every card and note</label>
      <input class="search" id="search" type="search" placeholder="e.g. FCFF, franking, AASB 16" value="${esc(notesQuery)}"></div>
      ${results || `<div class="block"><div class="notes-grid">${SECTIONS.map(s => `<button class="ncard" data-sec="${s.id}"><b>${esc(s.title)}</b><span>${esc(s.blurb)}</span><span class="num">${CARDS.filter(c => c.s === s.id).length} cards</span></button>`).join("")}</div></div>`}`;
    const inp = $("#search");
    inp.addEventListener("input", e => { notesQuery = e.target.value; const pos = e.target.selectionStart; renderNotes(); const n = $("#search"); n.focus(); n.setSelectionRange(pos, pos); });
  }
  app.querySelectorAll("[data-sec]").forEach(b => b.addEventListener("click", () => { notesSec = b.dataset.sec; renderNotes(); window.scrollTo(0, 0); }));
  app.querySelectorAll("[data-try]").forEach(b => b.addEventListener("click", () => startSession("cram", [b.dataset.try], "Drill")));
}

/* ---------- my notes ---------- */
let noteId = null, mineQuery = "", confirmDel = false, noteTimer = null;
const notesList = () => Object.values(P.notes || {}).filter(n => n && !n.deleted).sort((a, b) => b.updated - a.updated);
const fmtDate = t => new Date(t).toLocaleDateString("en-AU", { day: "numeric", month: "short", year: "numeric" });
const noteTitle = n => n.title.trim() || n.body.trim().split("\n")[0].slice(0, 80) || "Untitled note";
const noteSnippet = n => (n.title.trim() ? n.body : n.body.trim().split("\n").slice(1).join(" ")).replace(/\s+/g, " ").trim().slice(0, 160);
const noteItem = n => `<button class="nitem" data-note="${n.id}"><b>${esc(noteTitle(n))}</b>${noteSnippet(n) ? `<span>${esc(noteSnippet(n))}</span>` : ""}<small>${n.sec && SEC[n.sec] ? esc(SEC[n.sec].title) + " · " : ""}${fmtDate(n.updated)}</small></button>`;
function newNote(sec) {
  const id = "n" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), now = Date.now();
  P.notes[id] = { id, title: "", body: "", sec: sec || "", created: now, updated: now };
  openNote(id);
}
function openNote(id) { noteId = id; confirmDel = false; setTab("mine"); }
function flushNote() { if (noteTimer) { clearTimeout(noteTimer); noteTimer = null; saveNote(); } }
function saveNote() {
  const n = P.notes[noteId]; if (!n || !$("#nbody")) return;
  n.title = $("#ntitle").value; n.body = $("#nbody").value; n.sec = $("#nsec").value; n.updated = Date.now();
  persist(); const s = $("#saved"); if (s) s.textContent = "Saved";
}
function closeNote() {
  flushNote();
  const n = P.notes[noteId];
  if (n && !n.title.trim() && !n.body.trim()) { delete P.notes[noteId]; persist(); }
  noteId = null; renderMine(); window.scrollTo(0, 0);
}
function renderMine() {
  if (noteId && P.notes[noteId] && !P.notes[noteId].deleted) return renderNoteEditor();
  noteId = null;
  const all = notesList(), q = mineQuery.trim().toLowerCase();
  const list = all.filter(n => !q || (n.title + " " + n.body).toLowerCase().includes(q));
  app.innerHTML = `<div class="mine-head"><div><div class="eyebrow">Your own thoughts</div><h1 class="h1">My notes</h1></div><button class="btn primary" id="newnote">New note</button></div>
    ${all.length ? `<input class="search" id="msearch" type="search" placeholder="Search your notes" value="${esc(mineQuery)}" aria-label="Search your notes">` : ""}
    <div class="nlist">${list.length ? list.map(noteItem).join("") : all.length ? `<p class="muted">No notes match “${esc(mineQuery)}”.</p>` :
      `<div class="empty"><p><b>Nothing here yet.</b></p><p class="muted">Write down a formula you keep mixing up, how a company books its deposits, or a question you got in an interview. Tag a note with a section and it also shows on that section's notes page.</p></div>`}</div>`;
  $("#newnote").addEventListener("click", () => newNote(""));
  app.querySelectorAll("[data-note]").forEach(b => b.addEventListener("click", () => openNote(b.dataset.note)));
  const inp = $("#msearch");
  if (inp) inp.addEventListener("input", e => { mineQuery = e.target.value; const pos = e.target.selectionStart; renderMine(); const n = $("#msearch"); n.focus(); n.setSelectionRange(pos, pos); });
}
function renderNoteEditor() {
  const n = P.notes[noteId];
  app.innerHTML = `<div class="study-head"><button class="link" id="nback">← My notes</button><span class="muted saved" id="saved">Saved</span></div>
    <div class="editor">
      <input id="ntitle" class="ntitle" placeholder="Title" value="${esc(n.title)}" aria-label="Note title">
      <div class="field"><label for="nsec">Section</label><select id="nsec"><option value="">General</option>${SECTIONS.map(s => `<option value="${s.id}" ${n.sec === s.id ? "selected" : ""}>${esc(s.title)}</option>`).join("")}</select></div>
      <textarea id="nbody" class="nbody" placeholder="Write your thoughts…" aria-label="Note text">${esc(n.body)}</textarea>
      <div class="row">${confirmDel ? `<div class="confirm"><span>Delete this note${ref ? " on all your devices" : ""}?</span><button class="btn" id="ndelyes">Delete note</button><button class="link" id="ndelno">Cancel</button></div>`
        : `<button class="link danger" id="ndel">Delete note</button>`}<span class="muted small">Created ${fmtDate(n.created)}</span></div>
    </div>`;
  const body = $("#nbody");
  const grow = () => { body.style.height = "auto"; body.style.height = Math.max(body.scrollHeight + 2, 240) + "px"; };
  const onEdit = () => { $("#saved").textContent = "Saving…"; clearTimeout(noteTimer); noteTimer = setTimeout(() => { noteTimer = null; saveNote(); }, 500); };
  $("#ntitle").addEventListener("input", onEdit); body.addEventListener("input", () => { grow(); onEdit(); }); $("#nsec").addEventListener("change", onEdit);
  grow();
  if (!n.title && !n.body) $("#ntitle").focus();
  $("#nback").addEventListener("click", closeNote);
  $("#ndel")?.addEventListener("click", () => { flushNote(); confirmDel = true; renderNoteEditor(); });
  $("#ndelno")?.addEventListener("click", () => { confirmDel = false; renderNoteEditor(); });
  $("#ndelyes")?.addEventListener("click", () => {
    P.notes[noteId] = { id: noteId, deleted: true, title: "", body: "", updated: Date.now() };
    persist(); noteId = null; confirmDel = false; renderMine();
  });
}

/* ---------- backup (copy / paste, works offline and between devices) ---------- */
let backupMode = null, backupMsg = "";
function backupHtml() {
  if (backupMode === "export") return `<div class="backup"><textarea id="bk" readonly aria-label="Backup text">${esc(JSON.stringify(P))}</textarea><span class="muted small">${esc(backupMsg)}</span></div>`;
  if (backupMode === "import") return `<div class="backup"><textarea id="bk" placeholder="Paste a backup here" aria-label="Paste a backup"></textarea><div><button class="btn" id="bkgo">Restore</button> <span class="muted small">${esc(backupMsg)}</span></div></div>`;
  return backupMsg ? `<span class="muted small">${esc(backupMsg)}</span>` : "";
}
function wireBackup() {
  $("#exp").addEventListener("click", async () => {
    backupMode = "export"; backupMsg = "Select all and copy, then paste it into a note or message to yourself.";
    try { await navigator.clipboard.writeText(JSON.stringify(P)); backupMsg = "Copied to the clipboard. Paste it somewhere safe, or into Restore on another device."; } catch (e) {}
    renderToday(); const t = $("#bk"); t.focus(); t.select();
  });
  $("#imp").addEventListener("click", () => { backupMode = "import"; backupMsg = ""; renderToday(); $("#bk").focus(); });
  $("#bkgo")?.addEventListener("click", () => {
    try {
      const data = JSON.parse($("#bk").value);
      if (!data || typeof data.cards !== "object") throw new Error("not a backup");
      P = merge(P, Object.assign(blank(), data)); persist();
      backupMode = null; backupMsg = "Restored. Card history and notes from the backup were merged in.";
    } catch (e) { backupMsg = "That text isn't a valid backup. Copy the whole backup and try again."; }
    renderToday();
  });
}

/* ---------- practice ---------- */
function renderPractice() {
  const drillSecs = SECTIONS.filter(s => CARDS.some(c => c.s === s.id && c.t === "drill"));
  const opts = list => `<option value="all">All sections</option>` + list.map(s => `<option value="${s.id}">${esc(s.title)}</option>`).join("");
  app.innerHTML = `<div class="modes">
    <section class="mode"><div class="eyebrow">Case speed</div><h2>Drill sprint</h2>
      <p class="muted">Ten numeric problems with fresh numbers each time. Doesn't affect your daily schedule.</p>
      <div class="row"><select id="dsec" aria-label="Section">${opts(drillSecs)}</select><button class="btn primary" id="sprint">Start sprint</button></div></section>
    <section class="mode"><div class="eyebrow">Interview prep</div><h2>Interview round</h2>
      <p class="muted">Five random interview questions. Answer out loud with the timer running, then compare with the model answer.</p>
      <div class="row"><button class="btn primary" id="iround">Start round</button></div></section>
    <section class="mode"><div class="eyebrow">Revision</div><h2>Cram a section</h2>
      <p class="muted">Every card in one section, shuffled. Good before a meeting or interview on that topic.</p>
      <div class="row"><select id="csec" aria-label="Section">${SECTIONS.map(s => `<option value="${s.id}">${esc(s.title)}</option>`).join("")}</select><button class="btn" id="cram">Start</button></div></section>
    <section class="mode"><div class="eyebrow">Where to look</div><h2>Statement hunt</h2>
      <p class="muted">All the "where would you find it?" cards in a row.</p>
      <div class="row"><button class="btn" id="hunt">Start</button></div></section>
  </div>`;
  $("#sprint").addEventListener("click", () => {
    const sec = $("#dsec").value, pool = CARDS.filter(c => c.t === "drill" && (sec === "all" || c.s === sec)).map(c => c.id);
    const q = []; while (q.length < 10) q.push(...shuffle(pool.slice())); startSession("sprint", q.slice(0, 10), "Drill sprint");
  });
  $("#iround").addEventListener("click", () => startSession("cram", shuffle(CARDS.filter(c => c.t === "interview").map(c => c.id)).slice(0, 5), "Interview round"));
  $("#cram").addEventListener("click", () => { const s = $("#csec").value; startSession("cram", shuffle(CARDS.filter(c => c.s === s).map(c => c.id)), SEC[s].title); });
  $("#hunt").addEventListener("click", () => startSession("cram", shuffle(CARDS.filter(c => c.t === "where").map(c => c.id)), "Statement hunt"));
}

render();
initSync();
})();
</script>

if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});

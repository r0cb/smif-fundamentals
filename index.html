<title>SMIF Fundamentals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a single narrow study column (max 720px) under a sticky tab bar; the card is the one framed object. */
:root {
  --bg: #eef1f4; --surface: #ffffff; --sunk: #e3e8ed; --ink: #142029; --muted: #5a6875; --line: #d3dae1;
  --accent: #0e5a63; --accent-ink: #ffffff; --accent-soft: #d7ebec;
  --again: #b83a2b; --hard: #a66a12; --good: #2b7a4b; --easy: #2a5ea8;
  --again-soft: #f6dfdb; --good-soft: #dcefe3;
  --f-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1418; --surface: #161f25; --sunk: #1d2830; --ink: #e4eaee; --muted: #93a2ad; --line: #28343c;
  --accent: #56b4bd; --accent-ink: #062226; --accent-soft: #173538;
  --again: #e2715f; --hard: #d9a24a; --good: #5cbf85; --easy: #6fa2e6;
  --again-soft: #3a211d; --good-soft: #1a3426; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0e1418; --surface: #161f25; --sunk: #1d2830; --ink: #e4eaee; --muted: #93a2ad; --line: #28343c;
  --accent: #56b4bd; --accent-ink: #062226; --accent-soft: #173538;
  --again: #e2715f; --hard: #d9a24a; --good: #5cbf85; --easy: #6fa2e6;
  --again-soft: #3a211d; --good-soft: #1a3426; color-scheme: dark }

* { box-sizing: border-box }
html, body { min-height: 100% }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--f-body); -webkit-font-smoothing: antialiased }
button { font: inherit; color: inherit; cursor: pointer }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; line-height: 1.15; text-wrap: balance; margin: 0 }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line) }
.top-in { max-width: 720px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 17px; letter-spacing: -.01em; margin-right: auto; display: flex; align-items: center; gap: 8px }
.brand .short { display: none }
.brand i { width: 10px; height: 10px; border-radius: 2px; background: var(--accent); display: inline-block }
.tabs { display: flex; gap: 2px; background: var(--sunk); padding: 3px; border-radius: 8px }
.tabs button { border: 0; background: none; padding: 5px 12px; border-radius: 6px; font-size: 13px; font-weight: 500; color: var(--muted) }
.tabs button[aria-current="page"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08) }

main { max-width: 720px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 48px }
.eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted) }
.muted { color: var(--muted) }
.mono, .num { font-family: var(--f-mono); font-variant-numeric: tabular-nums }

.btn { border: 1px solid var(--line); background: var(--surface); padding: 9px 16px; border-radius: 8px; font-weight: 500 }
.btn:hover { border-color: var(--muted) }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600 }
.btn.primary:hover { filter: brightness(1.08) }
.btn:disabled { opacity: .5; cursor: default }
.link { border: 0; background: none; padding: 0; color: var(--accent); font-weight: 500 }

/* Today */
.today { display: grid; gap: 16px; padding: 20px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r) }
.today h1 { font-size: 26px }
.counts { display: flex; flex-wrap: wrap; gap: 24px }
.count b { display: block; font-family: var(--f-mono); font-size: 28px; font-weight: 500; line-height: 1.1 }
.count span { font-size: 12px; color: var(--muted) }
.count.due b { color: var(--accent) }
.today .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center }
.strip { display: flex; align-items: flex-end; gap: 3px; height: 38px }
.strip i { flex: 1; background: var(--sunk); border-radius: 2px; min-height: 3px; position: relative }
.strip i.on { background: var(--accent) }
.strip i.now { outline: 1px solid var(--accent); outline-offset: 1px }
.strip-wrap { display: grid; gap: 4px }
.strip-lbl { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted) }

.block { margin-top: 28px; display: grid; gap: 10px }
.block > h2 { font-size: 17px }
.secrows { display: grid; gap: 0; border-top: 1px solid var(--line) }
.secrow { display: grid; grid-template-columns: minmax(0, 1fr) 120px 64px; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; width: 100% }
.secrow:hover .sname { color: var(--accent) }
.sname { font-weight: 500; min-width: 0 }
.sname small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.bar { height: 6px; background: var(--sunk); border-radius: 3px; overflow: hidden; display: flex }
.bar .m { background: var(--accent) }
.bar .s { background: var(--accent-soft) }
.secrow .num { font-size: 12px; color: var(--muted); text-align: right }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted) }
.legend i { display: inline-block; width: 10px; height: 6px; border-radius: 2px; margin-right: 5px; vertical-align: middle }

.settings { display: grid; gap: 12px; padding: 16px; border: 1px solid var(--line); border-radius: var(--r) }
.field { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between }
.field label { font-weight: 500 }
select { font: inherit; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink) }
.sync { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px }
.sync i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted) }
.sync.ok i { background: var(--good) }
.sync.busy i { background: var(--hard) }
.sync.err i { background: var(--again) }
.confirm { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px; background: var(--again-soft); border-radius: 8px }

/* Study */
.study-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px }
.study-head .prog { flex: 1; height: 4px; background: var(--sunk); border-radius: 2px; overflow: hidden }
.study-head .prog i { display: block; height: 100%; background: var(--accent) }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 22px 20px; display: grid; gap: 16px; min-width: 0 }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center }
.chip { font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; padding: 3px 8px; border-radius: 4px; background: var(--sunk); color: var(--muted) }
.chip.t-formula { background: var(--accent-soft); color: var(--accent) }
.chip.t-drill { background: var(--accent); color: var(--accent-ink) }
.chip.new { background: none; border: 1px solid var(--accent); color: var(--accent) }
.q { font-family: var(--f-display); font-weight: 500; font-size: 22px; line-height: 1.3; letter-spacing: -.005em }
.q b, .q strong { font-weight: 700; color: var(--accent) }
.ans { border-top: 1px dashed var(--line); padding-top: 16px; min-width: 0 }
.rich { display: grid; gap: 10px; min-width: 0 }
.rich p, .rich ul { margin: 0 }
.rich ul { padding-left: 20px; display: grid; gap: 4px }
.rich h3 { font-size: 16px; margin-top: 14px }
.rich strong { font-weight: 600 }
.fx { font-family: var(--f-mono); font-size: 13.5px; background: var(--sunk); border-left: 3px solid var(--accent); padding: 8px 12px; border-radius: 0 6px 6px 0; overflow-x: auto; white-space: pre-wrap }
code.i { font-family: var(--f-mono); font-size: .92em; background: var(--sunk); padding: 1px 5px; border-radius: 4px }
.tw { overflow-x: auto }
.rich table, table.stmt { border-collapse: collapse; font-size: 13.5px; width: 100% }
.rich th, .rich td { text-align: left; padding: 6px 10px 6px 0; border-bottom: 1px solid var(--line); vertical-align: top }
.rich th { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600 }
table.stmt { max-width: 420px; font-variant-numeric: tabular-nums }
table.stmt td { padding: 5px 0; border-bottom: 1px solid var(--line) }
table.stmt td + td { text-align: right; font-family: var(--f-mono); padding-left: 16px; white-space: nowrap }
table.stmt tr.h td { font-family: var(--f-body); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted) }
table.stmt tr.tot td { border-top: 2px solid var(--ink); border-bottom: 3px double var(--ink); font-weight: 600 }

.where { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px }
.where button { padding: 12px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); text-align: left; font-weight: 500 }
.where button small { display: block; font-family: var(--f-mono); color: var(--muted); font-size: 11px }
.where button:hover:not(:disabled) { border-color: var(--accent) }
.where button.right { border-color: var(--good); background: var(--good-soft) }
.where button.wrong { border-color: var(--again); background: var(--again-soft) }
.where button:disabled { cursor: default }

.drill-in { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.drill-in input { font: 500 18px var(--f-mono); width: 180px; max-width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink) }
.drill-in .unit { font-family: var(--f-mono); color: var(--muted) }
.verdict { font-weight: 600; padding: 8px 12px; border-radius: 8px }
.verdict.ok { background: var(--good-soft); color: var(--good) }
.verdict.no { background: var(--again-soft); color: var(--again) }
.timer { font-family: var(--f-mono); font-size: 13px; color: var(--muted) }
.hint { font-size: 13px; color: var(--muted) }

.actions { position: sticky; bottom: 0; margin-top: 14px; padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(to bottom, transparent, var(--bg) 30%) }
.rate { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px }
.rate button { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 10px 4px; display: grid; gap: 2px; justify-items: center; font-weight: 600 }
.rate button small { font-family: var(--f-mono); font-size: 11px; font-weight: 400; color: var(--muted) }
.rate .r1 { color: var(--again) } .rate .r2 { color: var(--hard) } .rate .r3 { color: var(--good) } .rate .r4 { color: var(--easy) }
.rate button:hover { border-color: currentColor }
.rate button.suggest { box-shadow: inset 0 0 0 2px currentColor }
.reveal { width: 100%; padding: 13px }
.kbd { font-family: var(--f-mono); font-size: 11px; color: var(--muted); text-align: center; margin-top: 6px }
@media (hover: none) { .kbd { display: none } }

.done { text-align: center; padding: 40px 20px; display: grid; gap: 14px; justify-items: center }
.done h1 { font-size: 28px }

/* Notes */
.search { width: 100%; font: inherit; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink) }
.notes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px }
.ncard { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 14px; display: grid; gap: 4px }
.ncard:hover { border-color: var(--accent) }
.ncard b { font-family: var(--f-display); font-size: 16px }
.ncard span { font-size: 13px; color: var(--muted) }
.ncard .num { font-size: 11px }
.notes-body { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px }
details.qa { border-bottom: 1px solid var(--line); padding: 10px 0 }
details.qa summary { cursor: pointer; font-weight: 500; list-style: none; display: flex; gap: 10px }
details.qa summary::-webkit-details-marker { display: none }
details.qa summary::before { content: "+"; font-family: var(--f-mono); color: var(--accent); width: 12px; flex: none }
details.qa[open] summary::before { content: "−" }
details.qa .rich { margin: 10px 0 4px 22px }
mark { background: var(--accent-soft); color: inherit; border-radius: 2px }

/* Practice */
.modes { display: grid; gap: 12px }
.mode { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 16px; display: grid; gap: 10px }
.mode h2 { font-size: 18px }
.mode .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }

/* My notes */
.mine-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 14px }
.h1 { font-size: 26px }
.nlist { display: grid; gap: 8px; margin-top: 12px }
.nitem { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 3px; min-width: 0; width: 100% }
.nitem:hover { border-color: var(--accent) }
.nitem b { font-weight: 600 }
.nitem span { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.nitem small { font-size: 11px; color: var(--muted); font-family: var(--f-mono) }
.empty { padding: 20px; border: 1px dashed var(--line); border-radius: var(--r); display: grid; gap: 6px }
.empty p { margin: 0 }
.editor { display: grid; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px }
.ntitle { font: 600 20px var(--f-display); border: 0; border-bottom: 1px solid var(--line); background: none; color: var(--ink); padding: 4px 0 8px; width: 100% }
.ntitle:focus { outline: none; border-bottom-color: var(--accent) }
.nbody { font: 15px/1.6 var(--f-body); min-height: 40vh; resize: vertical; border: 1px solid var(--line); border-radius: 8px; padding: 12px; background: var(--bg); color: var(--ink); width: 100% }
.editor .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between }
.link.danger { color: var(--again) }
.saved { margin-left: auto; font-size: 12px }
.small { font-size: 12px }
.backup { display: grid; gap: 8px }
.backup textarea { width: 100%; min-height: 90px; font: 12px/1.4 var(--f-mono); border: 1px solid var(--line); border-radius: 8px; padding: 8px; background: var(--bg); color: var(--ink) }

@media (max-width: 640px) {
  .tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; border-radius: 0; padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); background: var(--surface); border-top: 1px solid var(--line) }
  .tabs button { padding: 10px 4px; font-size: 13px }
  .tabs button[aria-current="page"] { background: var(--accent-soft); color: var(--accent); box-shadow: none }
  main { padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)) }
  body.studying .tabs { display: none }
  body.studying main { padding-bottom: 24px }
  .search, select, .nbody, .ntitle, .drill-in input, .backup textarea { font-size: 16px }
}
@media (max-width: 520px) {
  .brand .full { display: none }
  .brand .short { display: inline }
  .q { font-size: 19px }
  .card { padding: 18px 16px }
  .secrow { grid-template-columns: minmax(0, 1fr) 70px 52px }
}
@media (prefers-reduced-motion: no-preference) {
  .card { animation: rise .18s ease-out }
  @keyframes rise { from { transform: translateY(4px); opacity: .6 } to { transform: none; opacity: 1 } }
}
</style>

<noscript><style>#app,.tabs{display:none!important}.static summary{cursor:pointer}.static .toc{columns:2;padding-left:18px}
.static details.notes-body summary{list-style:none}</style>
<main class="static"><div class="today"><h1>SMIF Fundamentals (read-only)</h1>
<p class="muted">This viewer can't run the app, so you're seeing the study book: every section's notes and cards, tap to reveal.
For daily spaced-repetition reviews, numeric drills, My notes and saved progress, open this file in a full browser, use the Mac app, or install the web app from Safari.</p>
<ul class="toc"><li><a href="#s-st">Three statements</a></li><li><a href="#s-cf">Cash flows</a></li><li><a href="#s-ev">Value measures</a></li><li><a href="#s-mx">Trading multiples</a></li><li><a href="#s-val">Valuation methods</a></li><li><a href="#s-rt">Ratios</a></li><li><a href="#s-acc">Accounting traps</a></li><li><a href="#s-au">Australia-specific</a></li><li><a href="#s-mac">Markets &amp; macro</a></li><li><a href="#s-pit">Pitching a stock</a></li></ul></div><section id="s-st" class="block"><div class="eyebrow">Section</div><h2 style="font-size:24px">Three statements</h2><details class="notes-body"><summary><strong>Notes</strong></summary><div class="rich"><h3>Income statement (performance over a period)</h3><div class="fx">Revenue − COGS = Gross profit</div><div class="fx">Gross profit − operating expenses = EBITDA</div><div class="fx">EBITDA − D&amp;A = EBIT</div><div class="fx">EBIT − net finance costs = Profit before tax (PBT)</div><div class="fx">PBT − income tax = NPAT</div><div class="fx">NPAT − NCI share = NPAT attributable to members → EPS</div><p>Accrual based: revenue is recognised when the performance obligation is met, not when cash arrives. Many ASX companies present expenses "by nature" (employee costs, occupancy, D&amp;A as separate lines).</p><h3>Balance sheet (position at a point in time)</h3><div class="fx">Assets = Liabilities + Equity</div><ul><li>Current assets: cash, receivables, inventory, prepayments</li><li>Non-current assets: PP&amp;E, right-of-use assets, intangibles and goodwill, deferred tax assets, investments in associates</li><li>Current liabilities: payables, contract liabilities (customer deposits, deferred revenue), current borrowings, current lease liabilities, provisions</li><li>Non-current liabilities: borrowings, lease liabilities, deferred tax liabilities, long-term provisions</li><li>Equity: contributed equity + reserves + retained earnings (+ NCI)</li></ul><h3>Cash flow statement (actual cash over a period)</h3><ul><li><strong>CFO</strong>: cash from trading (receipts from customers, payments to suppliers and staff, tax paid, often interest)</li><li><strong>CFI</strong>: capex, acquisitions, asset sales, investments</li><li><strong>CFF</strong>: debt drawn and repaid, lease principal, share issues and buybacks, dividends paid</li></ul><p>Most ASX companies use the <strong>direct method</strong> for CFO and put the NPAT → CFO reconciliation in the notes. US companies mostly use the indirect method.</p><h3>How they link</h3><ul><li>NPAT → retained earnings (less dividends) and → the start of the indirect CFO</li><li>Non-cash items (D&amp;A, SBC, impairments) are added back in CFO</li><li>Working capital changes on the BS flow through CFO</li><li>Capex → PP&amp;E on the BS and CFI on the CFS; D&amp;A then reduces PP&amp;E</li><li>Debt and equity raises → BS liabilities/equity and CFF</li><li>Closing cash on the CFS = cash on the BS</li></ul><h3>Where to look in an ASX annual report</h3><div class="tw"><table><thead><tr><th>Need</th><th>Go to</th></tr></thead><tbody><tr><td>Headline numbers, KPIs, LFL sales, store counts</td><td>Investor presentation, Operating and Financial Review (OFR)</td></tr><tr><td>Statutory vs underlying reconciliation</td><td>OFR, Appendix 4E, presentation appendix</td></tr><tr><td>Segment revenue and EBIT</td><td>Segment note</td></tr><tr><td>Shares on issue, options, rights</td><td>Contributed equity and share-based payment notes</td></tr><tr><td>Debt facilities and maturities</td><td>Borrowings / financial risk note</td></tr><tr><td>Lease liabilities</td><td>Leases note</td></tr><tr><td>Goodwill impairment assumptions</td><td>Intangibles note</td></tr><tr><td>Exec pay and incentive hurdles</td><td>Remuneration report</td></tr></tbody></table></div><h3>The scenario drill (memorise this method)</h3><p>For any event, go IS → CFS → BS and check the BS balances. With a 30% tax rate a $10 pre-tax expense costs $7 of NPAT.</p></div></details><h3 style="margin-top:8px">Cards: tap a question to reveal the answer</h3><div><details class="qa"><summary><span class="chip">Concept</span> What does each of the three financial statements tell you?</summary><div class="rich"><ul><li><strong>Income statement</strong>: performance over a period, on an accrual basis (revenue → NPAT)</li><li><strong>Balance sheet</strong>: financial position at a point in time; Assets = Liabilities + Equity</li><li><strong>Cash flow statement</strong>: actual cash in and out over the period, split CFO / CFI / CFF; reconciles opening to closing cash</li></ul></div></details><details class="qa"><summary><span class="chip">Interview</span> How do the three statements link together?</summary><div class="rich"><ul><li>NPAT from the IS flows to retained earnings on the BS (less dividends) and to the top of the indirect CFO</li><li>Non-cash expenses (D&amp;A, SBC, impairments) are added back in CFO</li><li>Changes in BS working capital flow through CFO</li><li>Capex hits CFI and adds to PP&amp;E; D&amp;A then reduces PP&amp;E</li><li>Debt and equity raised or repaid sit in CFF and on the BS</li><li>Closing cash on the CFS equals cash on the BS</li></ul></div></details><details class="qa"><summary><span class="chip">Interview</span> Walk me through a $10 increase in depreciation (30% tax rate).</summary><div class="rich"><p><strong>IS</strong>: EBIT −10, tax −3, NPAT −7<br><strong>CFS</strong>: NPAT −7, add back depreciation +10 → CFO +3 (the tax shield)<br><strong>BS</strong>: PP&amp;E −10, cash +3 → assets −7. Retained earnings −7 → balances</p></div></details><details class="qa"><summary><span class="chip">Interview</span> A company buys $20 of inventory with cash and hasn't sold it yet. Walk it through.</summary><div class="rich"><p><strong>IS</strong>: no change (COGS is recognised only when the stock is sold)<br><strong>CFS</strong>: increase in inventory → CFO −20<br><strong>BS</strong>: inventory +20, cash −20 → balances<br>When sold, COGS of 20 hits the IS and inventory falls.</p></div></details><details class="qa"><summary><span class="chip">Interview</span> A company borrows $100 to buy PP&amp;E (10-year life, 5% interest, 30% tax). Walk through the purchase and year 1.</summary><div class="rich"><p><strong>At purchase</strong>: CFI −100 (capex), CFF +100 (debt) → cash unchanged. BS: PP&amp;E +100, debt +100<br><strong>Year 1 IS</strong>: depreciation −10, interest −5 → PBT −15, tax +4.5, NPAT −10.5<br><strong>Year 1 CFS</strong>: NPAT −10.5 + depreciation 10 → CFO −0.5 (interest in CFO)<br><strong>Year 1 BS</strong>: cash −0.5, PP&amp;E 90 → assets +89.5 = debt +100, retained earnings −10.5</p></div></details><details class="qa"><summary><span class="chip">Interview</span> Walk me through a $50 asset write-down (30% tax).</summary><div class="rich"><p><strong>If tax-deductible</strong>: IS −50 pre-tax, NPAT −35. CFS: NPAT −35 + 50 non-cash add-back → CFO +15. BS: asset −50, cash +15, retained earnings −35.<br><strong>Goodwill impairment</strong> (usually not deductible): NPAT −50, add back 50 → CFO 0. BS: goodwill −50, retained earnings −50.<br>Either way it is non-cash and usually excluded from underlying profit.</p></div></details><details class="qa"><summary><span class="chip">Concept</span> What are the parts of shareholders' equity on the balance sheet?</summary><div class="rich"><div class="fx">Equity = Contributed equity + Reserves + Retained earnings (+ NCI)</div><ul><li><strong>Contributed equity</strong>: cash raised from issuing shares</li><li><strong>Reserves</strong>: SBP reserve, FX translation, hedging, revaluation</li><li><strong>Retained earnings</strong>: cumulative NPAT less dividends</li></ul></div></details><details class="qa"><summary><span class="chip">Concept</span> List the income statement lines from revenue to EPS.</summary><div class="rich"><div class="fx">Revenue − COGS = Gross profit</div><div class="fx">− Opex = EBITDA − D&amp;A = EBIT</div><div class="fx">− Net finance costs = PBT − Tax = NPAT</div><div class="fx">− NCI = NPAT attributable to members ÷ weighted average shares = EPS</div></div></details><details class="qa"><summary><span class="chip">Concept</span> Statutory vs underlying NPAT: what is the difference and what do you check?</summary><div class="rich"><p><strong>Statutory</strong>: per accounting standards, audited.<br><strong>Underlying</strong>: management-adjusted, removing items it calls one-off (restructuring, impairments, acquisition costs, sometimes AASB 16).<br>Check:</p><ul><li>The reconciliation (OFR, Appendix 4E, presentation appendix)</li><li>Whether "one-offs" recur every year</li><li>Whether only costs are removed and gains kept</li><li>That consensus uses the same basis</li></ul></div></details><details class="qa"><summary><span class="chip">Concept</span> What do an Appendix 4D, Appendix 4E and annual report contain?</summary><div class="rich"><ul><li><strong>4D</strong>: half-year report, lodged within 2 months of the half-year end</li><li><strong>4E</strong>: preliminary final report, within 2 months of year end; first release of full-year numbers</li><li><strong>Annual report</strong>: directors' report, OFR, remuneration report, financial statements, notes, directors' declaration, auditor's report</li></ul><p>KPIs and LFL numbers usually live in the investor presentation and OFR, not the statements.</p></div></details><details class="qa"><summary><span class="chip">Concept</span> Direct vs indirect cash flow method: which do ASX companies use?</summary><div class="rich"><ul><li><strong>Direct</strong>: shows receipts from customers and payments to suppliers and employees. Most ASX companies use it, with an NPAT → CFO reconciliation in the notes</li><li><strong>Indirect</strong>: starts from NPAT and adjusts for non-cash items and working capital. Standard in the US</li></ul><p>Both give the same CFO.</p></div></details><details class="qa"><summary><span class="chip">Concept</span> What goes through other comprehensive income (OCI) rather than NPAT?</summary><div class="rich"><ul><li>FX translation of foreign operations</li><li>Cash flow hedge gains and losses</li><li>PP&amp;E revaluations (revaluation model)</li><li>Fair value moves on FVOCI equity investments</li><li>Actuarial gains and losses on defined benefit plans</li></ul><p>OCI builds up in reserves on the BS, not retained earnings.</p></div></details><details class="qa"><summary><span class="chip">Interview</span> If you could only see one statement, which would you choose?</summary><div class="rich"><p><strong>The cash flow statement</strong>: it shows whether the business actually generates cash, and is harder to dress up than accrual profit. You can partly rebuild the IS from CFO plus working capital.<br>A good answer adds: for a highly levered company the balance sheet tells you whether it survives.</p></div></details><details class="qa"><summary><span class="chip">Interview</span> Can a company report positive NPAT and still go bust?</summary><div class="rich"><p>Yes. Profit is not cash:</p><ul><li>Working capital can absorb cash (receivables and inventory building)</li><li>Heavy capex or acquisitions</li><li>Debt maturities it cannot refinance</li></ul><p>Fast-growing companies often run out of cash while profitable.</p></div></details><details class="qa"><summary><span class="chip">Where?</span> Where do you look first for <strong>capex</strong>?</summary><div class="rich"><p><strong>Answer: Cash flow statement</strong></p><p><strong>Cash flow statement, CFI</strong>: "payments for property, plant and equipment" (and for intangibles/software).<br>The PP&amp;E note shows additions by asset class.</p></div></details><details class="qa"><summary><span class="chip">Where?</span> Where do you look first for <strong>dividends paid</strong> in cash?</summary><div class="rich"><p><strong>Answer: Cash flow statement</strong></p><p><strong>Cash flow statement, CFF</strong> (IFRS allows CFO, but almost all ASX companies use CFF).<br>Dividends declared and per-share amounts are in the dividends note and the statement of changes in equity.</p></div></details><details class="qa"><summary><span class="chip">Where?</span> Where do you look first for <strong>lease liabilities</strong>?</summary><div class="rich"><p><strong>Answer: Balance sheet</strong></p><p><strong>Balance sheet</strong>: current and non-current lease liabilities.<br>The leases note gives the maturity profile, ROU asset movements and the interest expense on leases.</p></div></details><details class="qa"><summary><span class="chip">Where?</span> Where do you look first for <strong>interest expense</strong>?</summary><div class="rich"><p><strong>Answer: Income statement</strong></p><p><strong>Income statement</strong>: "finance costs" (often split between borrowings and lease interest in the notes).<br><strong>Interest paid</strong> in cash is on the cash flow statement (CFO or CFF by policy).</p></div></details><details class="qa"><summary><span class="chip">Where?</span> Where do you look first for the <strong>number of shares on issue and options outstanding</strong>?</summary><div class="rich"><p><strong>Answer: Notes / other</strong></p><p><strong>Notes</strong>: contributed equity note (shares on issue) and share-based payment note (options, rights, performance rights).<br>The EPS note gives weighted average basic and diluted shares. For the live count use the latest ASX Appendix 2A/3B or 3G announcements.</p></div></details><details class="qa"><summary><span class="chip">Where?</span> Where do you look first for <strong>revenue and EBIT by division or region</strong>?</summary><div class="rich"><p><strong>Answer: Notes / other</strong></p><p><strong>Notes: segment note</strong> (AASB 8 operating segments).<br>The investor presentation usually has more detail (e.g. by brand or country) than the note.</p></div></details><details class="qa"><summary><span class="chip">Where?</span> Where do you look first for <strong>customer deposits / deferred revenue</strong>?</summary><div class="rich"><p><strong>Answer: Balance sheet</strong></p><p><strong>Balance sheet, current liabilities</strong>: usually called "contract liabilities" (AASB 15).<br>For a retailer taking deposits (e.g. Nick Scali), growth in this line is cash received before revenue is booked.</p></div></details><details class="qa"><summary><span class="chip">Where?</span> Where do you look first for <strong>income tax actually paid</strong> in cash?</summary><div class="rich"><p><strong>Answer: Cash flow statement</strong></p><p><strong>Cash flow statement, CFO</strong>: "income taxes paid".<br>The IS shows tax expense (accrual), which differs because of timing and deferred tax.</p></div></details><details class="qa"><summary><span class="chip">Where?</span> Where do you look first for <strong>share-based payment expense</strong>?</summary><div class="rich"><p><strong>Answer: Notes / other</strong></p><p><strong>Notes</strong>: share-based payments note (and the expenses note).<br>It is non-cash, so it appears as an add-back in the NPAT → CFO reconciliation, and builds the SBP reserve in equity.</p></div></details><details class="qa"><summary><span class="chip">Where?</span> Where do you look first for <strong>like-for-like (same-store) sales growth</strong>?</summary><div class="rich"><p><strong>Answer: Notes / other</strong></p><p><strong>Not in the statutory statements</strong>: it's a management KPI.<br>Find it in the investor presentation, the OFR in the annual report, or trading updates at results and the AGM.</p></div></details><details class="qa"><summary><span class="chip">Where?</span> Where do you look first for <strong>the assumptions behind a goodwill impairment test</strong>?</summary><div class="rich"><p><strong>Answer: Notes / other</strong></p><p><strong>Notes: intangible assets / impairment note</strong>.<br>It lists cash-generating units, discount rates, terminal growth rates and sensitivity (how much headroom before impairment).</p></div></details></div></section><section id="s-cf" class="block"><div class="eyebrow">Section</div><h2 style="font-size:24px">Cash flows</h2><details class="notes-body"><summary><strong>Notes</strong></summary><div class="rich"><h3>The three buckets</h3><div class="tw"><table><thead><tr><th></th><th>Typical items</th></tr></thead><tbody><tr><td>CFO</td><td>Receipts from customers, payments to suppliers and staff, tax paid, interest (policy choice under IFRS)</td></tr><tr><td>CFI</td><td>Capex, acquisitions, proceeds from asset sales, investments</td></tr><tr><td>CFF</td><td>Borrowings drawn/repaid, lease principal, share issues, buybacks, dividends paid</td></tr></tbody></table></div><h3>IFRS/AASB vs US GAAP classification</h3><div class="tw"><table><thead><tr><th>Item</th><th>IFRS (AASB 107 today)</th><th>US GAAP</th></tr></thead><tbody><tr><td>Interest paid</td><td>CFO or CFF</td><td>CFO</td></tr><tr><td>Interest received</td><td>CFO or CFI</td><td>CFO</td></tr><tr><td>Dividends received</td><td>CFO or CFI</td><td>CFO</td></tr><tr><td>Dividends paid</td><td>CFO or CFF</td><td>CFF</td></tr><tr><td>Lease principal (AASB 16)</td><td>CFF</td><td>Operating leases: CFO</td></tr></tbody></table></div><p>AASB 18 (periods beginning on or after 1 Jan 2027) removes most of the choice for non-financial companies: interest and dividends paid → CFF, interest and dividends received → CFI.</p><h3>Free cash flow formulas</h3><div class="fx">FCFF = EBIT × (1 − t) + D&amp;A − Capex − ΔNWC</div><div class="fx">FCFF = NPAT + D&amp;A + Interest × (1 − t) − Capex − ΔNWC</div><div class="fx">FCFF = CFO + Interest paid × (1 − t) − Capex   (if interest sits in CFO)</div><div class="fx">FCFF = EBITDA × (1 − t) + D&amp;A × t − Capex − ΔNWC</div><div class="fx">FCFE = FCFF − Interest × (1 − t) + Net borrowing</div><div class="fx">FCFE = NPAT + D&amp;A − Capex − ΔNWC + Net borrowing</div><div class="fx">"Simple" FCF = CFO − Capex (often also − lease principal)</div><h3>Which value each flow gives you</h3><div class="tw"><table><thead><tr><th>Flow</th><th>Belongs to</th><th>Discount at</th><th>Gives</th></tr></thead><tbody><tr><td>FCFF (unlevered)</td><td>Debt + equity</td><td>WACC</td><td>Enterprise value</td></tr><tr><td>FCFE (levered)</td><td>Equity only</td><td>Cost of equity</td><td>Equity value</td></tr></tbody></table></div><h3>Working capital signs</h3><p>An increase in a working capital asset (receivables, inventory) uses cash. An increase in a working capital liability (payables, customer deposits) frees cash.</p><div class="fx">ΔNWC = Δ(Receivables + Inventory) − Δ(Payables + Contract liabilities)</div><p>Subtract an increase in NWC in FCF.</p><h3>Cash conversion</h3><div class="fx">Cash conversion = CFO ÷ EBITDA   (or FCF ÷ NPAT)</div><p>Persistently below ~80–90% is a quality flag: receivables or inventory building, capitalised costs, provisions unwinding.</p></div></details><h3 style="margin-top:8px">Cards: tap a question to reveal the answer</h3><div><details class="qa"><summary><span class="chip">Concept</span> What goes in CFO, CFI and CFF?</summary><div class="rich"><ul><li><strong>CFO</strong>: receipts from customers, payments to suppliers and staff, tax paid, interest (policy choice under IFRS)</li><li><strong>CFI</strong>: capex, acquisitions, asset sales, investments</li><li><strong>CFF</strong>: debt drawn and repaid, lease principal, share issues, buybacks, dividends paid</li></ul></div></details><details class="qa"><summary><span class="chip">Concept</span> How are interest and dividends classified under IFRS/AASB vs US GAAP?</summary><div class="rich"><div class="tw"><table><thead><tr><th>Item</th><th>IFRS (AASB 107)</th><th>US GAAP</th></tr></thead><tbody><tr><td>Interest paid</td><td>CFO or CFF</td><td>CFO</td></tr><tr><td>Interest received</td><td>CFO or CFI</td><td>CFO</td></tr><tr><td>Dividends received</td><td>CFO or CFI</td><td>CFO</td></tr><tr><td>Dividends paid</td><td>CFO or CFF</td><td>CFF</td></tr></tbody></table></div><p>AASB 18 (from periods starting 1 Jan 2027) moves most non-financial companies to: paid → CFF, received → CFI.<br>So check the policy before comparing CFO across companies.</p></div></details><details class="qa"><summary><span class="chip">Concept</span> Where do lease payments go in the cash flow statement under AASB 16?</summary><div class="rich"><ul><li><strong>Principal</strong> → CFF</li><li><strong>Interest</strong> → CFO or CFF (same policy as other interest)</li><li>Short-term, low-value and variable lease payments → CFO</li></ul><p>Result: post-AASB 16 CFO looks higher than pre-AASB 16 for the same business. Deduct lease principal to get a like-for-like FCF.</p></div></details><details class="qa"><summary><span class="chip">Formula</span> FCFF starting from EBIT?</summary><div class="rich"><div class="fx">FCFF = EBIT × (1 − t) + D&amp;A − Capex − ΔNWC</div><p>EBIT × (1 − t) is NOPAT: operating profit after tax, as if there were no debt.</p></div></details><details class="qa"><summary><span class="chip">Formula</span> FCFF starting from NPAT?</summary><div class="rich"><div class="fx">FCFF = NPAT + D&amp;A + Interest × (1 − t) − Capex − ΔNWC</div><p>Add back after-tax interest because FCFF is before payments to lenders. Also add other non-cash items (SBC, impairments) if you treat them as non-cash.</p></div></details><details class="qa"><summary><span class="chip">Formula</span> FCFF starting from CFO?</summary><div class="rich"><div class="fx">FCFF = CFO + Interest paid × (1 − t) − Capex</div><p>Only add back interest if it is classified in CFO. If interest sits in CFF it was never deducted from CFO.</p></div></details><details class="qa"><summary><span class="chip">Formula</span> FCFF starting from EBITDA?</summary><div class="rich"><div class="fx">FCFF = EBITDA × (1 − t) + D&amp;A × t − Capex − ΔNWC</div><p>The D&amp;A × t term adds back the tax shield from depreciation. Equivalent to: EBITDA − tax on EBIT − Capex − ΔNWC.</p></div></details><details class="qa"><summary><span class="chip">Formula</span> How do you get from FCFF to FCFE?</summary><div class="rich"><div class="fx">FCFE = FCFF − Interest × (1 − t) + Net borrowing</div><p>Net borrowing = new debt drawn − debt repaid.</p></div></details><details class="qa"><summary><span class="chip">Formula</span> FCFE starting from NPAT?</summary><div class="rich"><div class="fx">FCFE = NPAT + D&amp;A − Capex − ΔNWC + Net borrowing</div><p>NPAT is already after interest, so there is no interest adjustment.</p></div></details><details class="qa"><summary><span class="chip">Concept</span> What is "simple" free cash flow and how does it differ from FCFF and FCFE?</summary><div class="rich"><div class="fx">FCF = CFO − Capex   (often also − lease principal)</div><p>Used in company reports and FCF yields. It is after interest if interest is in CFO, so it is closer to FCFE before debt flows. FCFF is strictly pre-financing. Always check which definition a broker or company uses.</p></div></details><details class="qa"><summary><span class="chip">Concept</span> Unlevered vs levered free cash flow?</summary><div class="rich"><div class="tw"><table><thead><tr><th></th><th>Unlevered (FCFF)</th><th>Levered (FCFE)</th></tr></thead><tbody><tr><td>Before/after debt</td><td>Before interest and debt flows</td><td>After interest and net borrowing</td></tr><tr><td>Belongs to</td><td>Debt + equity holders</td><td>Equity holders</td></tr><tr><td>Discount at</td><td>WACC</td><td>Cost of equity</td></tr><tr><td>Gives</td><td>Enterprise value</td><td>Equity value</td></tr></tbody></table></div></div></details><details class="qa"><summary><span class="chip">Concept</span> Why is EBITDA not the same as operating cash flow?</summary><div class="rich"><p>EBITDA ignores:</p><ul><li>Tax paid</li><li>Interest paid (if in CFO)</li><li>Working capital movements</li><li>Cash spent on items expensed below EBITDA or provisions unwinding</li><li>Under AASB 16, the lease cost (now in D&amp;A and interest, with principal in CFF)</li></ul><p>It also excludes capex, so it is not free cash flow either.</p></div></details><details class="qa"><summary><span class="chip">Concept</span> What is cash conversion and what is a red flag?</summary><div class="rich"><div class="fx">Cash conversion = CFO ÷ EBITDA   (or FCF ÷ NPAT)</div><p>~90–100%+ is healthy for most businesses. Persistently low conversion suggests receivables or inventory building, aggressive revenue recognition or capitalised costs: profit that is not turning into cash.</p></div></details><details class="qa"><summary><span class="chip">Concept</span> Maintenance vs growth capex: what's the difference and how do you estimate maintenance capex?</summary><div class="rich"><ul><li><strong>Maintenance</strong>: keeps existing capacity running (refurbishments, replacements)</li><li><strong>Growth</strong>: expands capacity (new stores, new plants)</li></ul><p>Estimating maintenance capex when it is not disclosed:</p><ul><li>Use D&amp;A as a proxy</li><li>Use capex in a year with no growth</li><li>Use management commentary (e.g. refurb capex per store)</li></ul><p>Growth capex = Total capex − Maintenance capex.</p></div></details><details class="qa"><summary><span class="chip">Concept</span> What is the cash effect of increases in receivables, inventory, payables and customer deposits?</summary><div class="rich"><div class="tw"><table><thead><tr><th>Increase in</th><th>Cash effect</th></tr></thead><tbody><tr><td>Receivables</td><td>Uses cash (−)</td></tr><tr><td>Inventory</td><td>Uses cash (−)</td></tr><tr><td>Payables</td><td>Frees cash (+)</td></tr><tr><td>Customer deposits / deferred revenue</td><td>Frees cash (+)</td></tr></tbody></table></div><div class="fx">ΔNWC = Δ(Receivables + Inventory) − Δ(Payables + Deposits); subtract an increase in FCF.</div></div></details><details class="qa"><summary><span class="chip">Interview</span> Why do we add back depreciation in the cash flow statement?</summary><div class="rich"><p>Depreciation reduced NPAT but no cash left the business that year. The cash went out when the asset was bought, and that was recorded as capex in CFI. Adding it back avoids counting the cost twice.</p></div></details><details class="qa"><summary><span class="chip">Interview</span> A company has negative working capital. Good or bad?</summary><div class="rich"><p>Usually good: customers or suppliers are funding the business (supermarkets, retailers that take deposits). Growth releases cash.<br>Risk: it reverses if sales slow. Deposits fall and payables shrink, causing a cash outflow just when trading is weak.</p></div></details><details class="qa"><summary><span class="chip">Concept</span> How should you treat share-based compensation in free cash flow?</summary><div class="rich"><p>It is added back in CFO as non-cash, which flatters FCF. But it is a real cost to shareholders through dilution.<br>Either deduct SBC from FCF, or keep it added back and use a fully diluted share count. Never ignore it for tech or high-SBC companies.</p></div></details><details class="qa"><summary><span class="chip">Interview</span> Why do most DCFs use FCFF rather than FCFE?</summary><div class="rich"><ul><li>Capital structure neutral: you value the operations, then subtract net debt</li><li>More stable: FCFE swings with borrowing and repayments</li><li>Easier to compare with comps on EV multiples</li></ul><p>Use FCFE (or a DDM) for banks and insurers, where debt is part of operations.</p></div></details><details class="qa"><summary><span class="chip">Where?</span> Where do you look first for <strong>interest paid</strong> in cash?</summary><div class="rich"><p><strong>Answer: Cash flow statement</strong></p><p><strong>Cash flow statement</strong>: in CFO or CFF depending on the company's policy (check the accounting policies note).<br>Interest expense (accrual) is in finance costs on the IS.</p></div></details></div></section><section id="s-ev" class="block"><div class="eyebrow">Section</div><h2 style="font-size:24px">Value measures</h2><details class="notes-body"><summary><strong>Notes</strong></summary><div class="rich"><h3>Definitions</h3><ul><li><strong>Market cap</strong> = share price × basic shares on issue</li><li><strong>Equity value</strong> = share price × diluted shares (options, rights, convertibles in the money)</li><li><strong>Enterprise value</strong> = value of the operating business to all capital providers</li><li><strong>Book value</strong> = shareholders' equity on the balance sheet (historical cost)</li></ul><h3>The EV bridge</h3><div class="fx">EV = Equity value + Debt + Preference shares + NCI + Lease liabilities* + Unfunded pensions − Cash − Associates/JVs − Other non-operating assets</div><p>*Only include leases if the multiple uses post-AASB 16 EBITDA.</p><div class="tw"><table><thead><tr><th>Item</th><th>Direction</th><th>Why</th></tr></thead><tbody><tr><td>Debt</td><td>+</td><td>Another claim on operating cash flows</td></tr><tr><td>Cash</td><td>−</td><td>Non-operating; a buyer effectively gets it back</td></tr><tr><td>NCI (minorities)</td><td>+</td><td>EBITDA consolidates 100% of subsidiaries</td></tr><tr><td>Associates / JVs</td><td>−</td><td>Their earnings are not in EBITDA</td></tr><tr><td>Preference shares</td><td>+</td><td>Senior claim, debt-like</td></tr></tbody></table></div><h3>What changes EV?</h3><div class="tw"><table><thead><tr><th>Event</th><th>Equity value</th><th>Net debt</th><th>EV</th></tr></thead><tbody><tr><td>Issue $100 shares for cash</td><td>+100</td><td>−100</td><td>0</td></tr><tr><td>Borrow $100</td><td>0</td><td>0</td><td>0</td></tr><tr><td>Pay a $50 dividend</td><td>−50</td><td>+50</td><td>0</td></tr><tr><td>Buy $100 of PP&amp;E with cash</td><td>0</td><td>+100</td><td>+100 in theory (if it is worth what you paid, equity is unchanged)</td></tr></tbody></table></div><h3>Diluted shares</h3><div class="fx">Treasury stock method: net new shares = Options × (1 − Strike ÷ Price)   (only if Strike &lt; Price)</div><p>Convertibles: if in the money, add the conversion shares and remove the debt (never both).</p><h3>Matching rule</h3><p>EV pairs with pre-interest metrics (Sales, EBITDA, EBIT, FCFF). Equity value pairs with post-interest metrics (NPAT, EPS, FCFE, dividends, book value).</p></div></details><h3 style="margin-top:8px">Cards: tap a question to reveal the answer</h3><div><details class="qa"><summary><span class="chip">Concept</span> What is enterprise value?</summary><div class="rich"><p>The value of the operating business to <strong>all</strong> capital providers (debt, equity and other claims), net of cash and non-operating assets.<br>Roughly, what it would cost to buy the whole business and take on its debt, net of the cash you get with it.</p></div></details><details class="qa"><summary><span class="chip">Formula</span> Write out the full EV bridge.</summary><div class="rich"><div class="fx">EV = Equity value + Debt + Preference shares + NCI + Lease liabilities* + Unfunded pensions − Cash − Associates/JVs − Non-operating assets</div><p>*Include leases only if pairing with post-AASB 16 EBITDA.</p></div></details><details class="qa"><summary><span class="chip">Concept</span> Market cap vs equity value vs book value?</summary><div class="rich"><ul><li><strong>Market cap</strong> = Price × basic shares</li><li><strong>Equity value</strong> = Price × diluted shares (adds in-the-money options, rights, convertibles)</li><li><strong>Book value</strong> = shareholders' equity on the BS, at historical cost</li></ul><p>Market value reflects expected future cash flows; book value reflects what was put in plus retained profits.</p></div></details><details class="qa"><summary><span class="chip">Interview</span> Why do you subtract cash when calculating EV?</summary><div class="rich"><p>Cash is a non-operating asset. A buyer of the whole company gets the cash, which effectively reduces the price paid. EV measures only the operating business, and operating metrics like EBITDA exclude interest earned on cash.</p></div></details><details class="qa"><summary><span class="chip">Interview</span> Why do you add non-controlling interests (minorities) to EV?</summary><div class="rich"><p>If a company owns 70% of a subsidiary it still consolidates 100% of the subsidiary's revenue and EBITDA. To keep the multiple consistent, EV must include the 30% claim of the minority holders.</p></div></details><details class="qa"><summary><span class="chip">Interview</span> Why do you subtract investments in associates and JVs from EV?</summary><div class="rich"><p>Associates are equity-accounted: their profit appears as a single "share of profit" line, not in revenue or EBITDA. Since the denominator excludes them, remove their value from the numerator too.</p></div></details><details class="qa"><summary><span class="chip">Interview</span> What happens to EV if a company issues $100 of shares, borrows $100, or pays a $50 dividend?</summary><div class="rich"><div class="tw"><table><thead><tr><th>Event</th><th>Equity value</th><th>Net debt</th><th>EV</th></tr></thead><tbody><tr><td>Issue $100 shares</td><td>+100</td><td>−100 (cash up)</td><td>0</td></tr><tr><td>Borrow $100</td><td>0</td><td>0 (debt and cash both up)</td><td>0</td></tr><tr><td>Pay $50 dividend</td><td>−50</td><td>+50 (cash down)</td><td>0</td></tr></tbody></table></div><p>Financing decisions do not change EV; only operating value does.</p></div></details><details class="qa"><summary><span class="chip">Interview</span> Can enterprise value be negative?</summary><div class="rich"><p>Yes: if cash exceeds market cap plus debt. It happens with cash-rich companies the market thinks will burn the cash (e.g. some biotechs or distressed businesses), meaning the market values the operations below zero.</p></div></details><details class="qa"><summary><span class="chip">Interview</span> Can equity value be higher than enterprise value?</summary><div class="rich"><p>Yes, whenever a company has <strong>net cash</strong> (cash &gt; debt and other claims). Example: market cap 500, debt 50, cash 150 → EV = 400.</p></div></details><details class="qa"><summary><span class="chip">Concept</span> How does the treasury stock method work?</summary><div class="rich"><p>Assume in-the-money options are exercised. The company receives Strike × Options in cash and uses it to buy back shares at the current price.</p><div class="fx">Net new shares = Options × (1 − Strike ÷ Price)</div><p>Ignore options with strike above the share price.</p></div></details><details class="qa"><summary><span class="chip">Concept</span> How do you treat convertible notes in equity value and EV?</summary><div class="rich"><ul><li><strong>In the money</strong> (share price &gt; conversion price): treat as equity. Add the conversion shares and do NOT also count the note as debt</li><li><strong>Out of the money</strong>: treat as debt at face value</li></ul><p>Never count it as both.</p></div></details><details class="qa"><summary><span class="chip">Concept</span> How is net debt defined, and should leases be included?</summary><div class="rich"><div class="fx">Net debt = Borrowings (current + non-current) − Cash and equivalents</div><p>Leases: include lease liabilities only if your EBITDA is post-AASB 16 (rent excluded). Companies often report both "net debt" and "net debt incl. leases". Be consistent across comps.</p></div></details><details class="qa"><summary><span class="chip">Concept</span> Which metrics pair with EV and which with equity value?</summary><div class="rich"><div class="tw"><table><thead><tr><th>EV (all capital)</th><th>Equity value (shareholders)</th></tr></thead><tbody><tr><td>Revenue</td><td>NPAT / EPS</td></tr><tr><td>EBITDA, EBITDAR</td><td>FCFE</td></tr><tr><td>EBIT</td><td>Dividends</td></tr><tr><td>FCFF</td><td>Book value</td></tr></tbody></table></div><p>Test: is the metric before or after interest? Before → EV. After → equity value.</p></div></details><details class="qa"><summary><span class="chip">Interview</span> Two companies are identical except one has much more debt. Which has the higher EV? Higher equity value?</summary><div class="rich"><p>In theory EV is roughly the same (Modigliani–Miller): the operations are identical. With tax, the levered company's EV is slightly higher from the interest tax shield, until distress costs kick in.<br>Equity value is lower for the levered company because more of the EV belongs to lenders.</p></div></details><details class="qa"><summary><span class="chip">Interview</span> Why use the market value of equity rather than book value in EV and WACC?</summary><div class="rich"><p>Book value is historical cost and accumulated profits. Market value reflects what investors expect the business to earn in future and what they would pay today. Valuation is about the future.</p></div></details><details class="qa"><summary><span class="chip">Where?</span> Where do you look first for <strong>total borrowings</strong>?</summary><div class="rich"><p><strong>Answer: Balance sheet</strong></p><p><strong>Balance sheet</strong>: current and non-current borrowings (interest-bearing liabilities).<br>The borrowings / financial risk note gives facility limits, maturities, interest rates and covenants.</p></div></details><details class="qa"><summary><span class="chip">Interview</span> In an acquisition, what is the difference between the offer price and transaction (enterprise) value?</summary><div class="rich"><ul><li><strong>Offer / equity value</strong>: what the acquirer pays shareholders (offer price × diluted shares)</li><li><strong>Transaction value (EV)</strong>: equity value + net debt assumed or refinanced (+ other claims)</li></ul><p>Deal multiples (e.g. EV/EBITDA paid) use transaction value.</p></div></details></div></section><section id="s-mx" class="block"><div class="eyebrow">Section</div><h2 style="font-size:24px">Trading multiples</h2><details class="notes-body"><summary><strong>Notes</strong></summary><div class="rich"><h3>Core multiples</h3><div class="tw"><table><thead><tr><th>Multiple</th><th>Formula</th><th>Best for</th><th>Watch out</th></tr></thead><tbody><tr><td>EV/Sales</td><td>EV ÷ Revenue</td><td>Loss-makers, early stage</td><td>Ignores margins entirely</td></tr><tr><td>EV/EBITDA</td><td>EV ÷ EBITDA</td><td>Most industrials; capital-structure neutral</td><td>Ignores capex; AASB 16 inflates EBITDA</td></tr><tr><td>EV/EBIT</td><td>EV ÷ EBIT</td><td>Capital-intensive; retail post-AASB 16</td><td>Acquisition amortisation</td></tr><tr><td>EV/EBITDAR</td><td>EV (+ capitalised rent) ÷ EBITDAR</td><td>Lessees vs owners (airlines, retail)</td><td>Mostly superseded by AASB 16</td></tr><tr><td>P/E</td><td>Price ÷ EPS</td><td>Profitable, steady companies</td><td>Leverage, tax and one-offs distort</td></tr><tr><td>PEG</td><td>P/E ÷ EPS growth %</td><td>Growth companies</td><td>Growth estimate is the whole answer</td></tr><tr><td>P/B</td><td>Price ÷ Book value per share</td><td>Banks, insurers</td><td>Book ≠ value for asset-light firms</td></tr><tr><td>P/TBV</td><td>Price ÷ Tangible book per share</td><td>Banks</td><td></td></tr><tr><td>Dividend yield</td><td>DPS ÷ Price</td><td>Income stocks; gross up for franking in AU</td><td>Payout may be unsustainable</td></tr><tr><td>FCF yield</td><td>FCF ÷ Market cap</td><td>Cash generation vs bond yields</td><td>Lumpy capex</td></tr></tbody></table></div><h3>Theory behind a multiple</h3><div class="fx">Forward P/E = Payout ratio ÷ (Ke − g)</div><div class="fx">Justified P/B = (ROE − g) ÷ (Ke − g)</div><p>Higher growth, higher returns on capital and lower risk all justify a higher multiple.</p><h3>Sector multiples</h3><div class="tw"><table><thead><tr><th>Sector</th><th>Multiples</th></tr></thead><tbody><tr><td>Banks</td><td>P/B, P/E, dividend yield, ROE</td></tr><tr><td>REITs</td><td>P/NTA, FFO/AFFO yield, distribution yield, gearing</td></tr><tr><td>Miners</td><td>EV/EBITDA at spot vs consensus prices, P/NAV, EV/resource</td></tr><tr><td>Software</td><td>EV/ARR, EV/Revenue, Rule of 40</td></tr><tr><td>Retail</td><td>EV/EBIT, P/E, sales per sqm, LFL growth</td></tr></tbody></table></div><h3>Rules</h3><ul><li>Numerator and denominator must belong to the same claimholders: never EV/NPAT or P/EBITDA</li><li>LTM = last 12 months actual; NTM = next 12 months consensus. Use the same basis across comps</li><li>Calendarise June year-ends to compare with December peers: CY26 = 0.5 × FY26 + 0.5 × FY27</li><li>For cyclicals use mid-cycle earnings: P/E looks lowest at the peak of the cycle</li></ul></div></details><h3 style="margin-top:8px">Cards: tap a question to reveal the answer</h3><div><details class="qa"><summary><span class="chip">Concept</span> EV/EBITDA: what does it tell you, and what are its flaws?</summary><div class="rich"><p>How many years of pre-D&amp;A operating profit the whole business costs. Capital-structure neutral, so useful across companies with different debt.<br>Flaws:</p><ul><li>Ignores capex intensity (two firms with the same EBITDA can have very different FCF)</li><li>Ignores tax</li><li>AASB 16 inflates EBITDA for lessees</li></ul></div></details><details class="qa"><summary><span class="chip">Concept</span> When is EV/EBIT better than EV/EBITDA?</summary><div class="rich"><p>When capital intensity differs between companies: D&amp;A approximates the cost of maintaining assets, so EBIT is closer to sustainable profit. Preferred for retailers post-AASB 16 and for capital-heavy industrials.<br>Watch for acquisition amortisation, which depresses EBIT without being an operating cost. Use EBITA if material.</p></div></details><details class="qa"><summary><span class="chip">Concept</span> When do you use EV/Sales?</summary><div class="rich"><p>For loss-making or early-stage companies where earnings are negative or meaningless (software, biotech with product revenue, turnarounds).<br>Weakness: it ignores profitability. Always pair it with the margin you think the company can reach.</p></div></details><details class="qa"><summary><span class="chip">Concept</span> P/E: what does it tell you and what distorts it?</summary><div class="rich"><div class="fx">P/E = Share price ÷ EPS = Market cap ÷ NPAT</div><p>Years of current earnings an investor pays for. Equity-level, so affected by:</p><ul><li>Leverage (more debt → more volatile EPS)</li><li>Tax rates and one-off items (use underlying EPS)</li><li>Accounting choices (D&amp;A lives, capitalisation)</li></ul><p>Use forward (NTM) P/E for pitching.</p></div></details><details class="qa"><summary><span class="chip">Formula</span> What is the PEG ratio and how do you read it?</summary><div class="rich"><div class="fx">PEG = P/E ÷ EPS growth (%, as a whole number)</div><p>P/E of 20 with 20% growth → PEG 1.0. Below 1 suggests growth is cheap; above 2 is expensive.<br>Weakness: depends entirely on the growth forecast and ignores risk and payout.</p></div></details><details class="qa"><summary><span class="chip">Concept</span> When do you use P/B, and what justifies a high P/B?</summary><div class="rich"><div class="fx">P/B = Price ÷ Book value per share</div><p>Used for banks, insurers and asset-heavy businesses where book value approximates the value of assets.</p><div class="fx">Justified P/B = (ROE − g) ÷ (Ke − g)</div><p>P/B above 1 is justified only if ROE exceeds the cost of equity.</p></div></details><details class="qa"><summary><span class="chip">Concept</span> What is P/TBV and why use it?</summary><div class="rich"><div class="fx">P/TBV = Price ÷ (Book value − Goodwill − Intangibles) per share</div><p>Strips out acquisition goodwill and intangibles, which cannot absorb losses. Standard for banks and for comparing acquisitive vs organic companies.</p></div></details><details class="qa"><summary><span class="chip">Concept</span> Dividend yield: formula and Australian twist?</summary><div class="rich"><div class="fx">Dividend yield = DPS ÷ Share price</div><p>In Australia brokers often quote the <strong>grossed-up</strong> yield including franking credits:</p><div class="fx">Grossed-up yield = DPS × (1 + Franking % × 0.3 ÷ 0.7) ÷ Price</div><p>A 5% fully franked yield ≈ 7.1% grossed up.</p></div></details><details class="qa"><summary><span class="chip">Concept</span> What is FCF yield and how does it differ from an unlevered FCF yield?</summary><div class="rich"><div class="fx">Equity FCF yield = FCF (after interest) ÷ Market cap = 1 ÷ (P/FCF)</div><div class="fx">Unlevered FCF yield = FCFF ÷ EV</div><p>Compare with bond yields and cost of capital. An FCF yield above the cost of equity with some growth suggests value.</p></div></details><details class="qa"><summary><span class="chip">Concept</span> What is the earnings yield and how is it used?</summary><div class="rich"><div class="fx">Earnings yield = EPS ÷ Price = 1 ÷ (P/E)</div><p>A P/E of 20 is a 5% earnings yield. Used to compare equities with bond yields (a rough gauge of the equity risk premium being priced).</p></div></details><details class="qa"><summary><span class="chip">Concept</span> What is EV/EBITDAR and is it still relevant post-AASB 16?</summary><div class="rich"><p>EBITDAR = EBITDA before rent. EV is adjusted by adding capitalised leases (rent × ~8, or lease liabilities). It compared companies that lease vs own assets (airlines, retailers, hotels).<br>Post-AASB 16, most rent is already out of EBITDA and lease liabilities can go into EV, so it is mostly superseded. It is still used where variable or short-term rent remains material.</p></div></details><details class="qa"><summary><span class="chip">Concept</span> Why is EV/NPAT or P/EBITDA wrong?</summary><div class="rich"><p>The numerator and denominator must belong to the same claimholders.</p><ul><li>EBITDA is available to debt and equity → pair with EV</li><li>NPAT is after interest, so it belongs to equity only → pair with equity value</li></ul><p>Mixing them makes leverage distort the multiple.</p></div></details><details class="qa"><summary><span class="chip">Concept</span> LTM vs NTM multiples, and how do you calendarise?</summary><div class="rich"><ul><li><strong>LTM (trailing)</strong>: last 12 months of actual results. Reliable but backward-looking</li><li><strong>NTM (forward)</strong>: next 12 months of consensus. Standard for growing companies and pitches</li></ul><p>Calendarise June year-ends to compare with December peers:</p><div class="fx">CY26 = 0.5 × FY26 + 0.5 × FY27</div></div></details><details class="qa"><summary><span class="chip">Concept</span> What makes one company deserve a higher multiple than another?</summary><div class="rich"><ul><li><strong>Growth</strong>: faster sustainable growth</li><li><strong>Returns</strong>: higher ROIC relative to WACC (growth only adds value if ROIC &gt; WACC)</li><li><strong>Risk</strong>: lower cost of equity (stable earnings, low leverage, low beta)</li><li><strong>Quality</strong>: predictability, competitive moat, management, cash conversion</li></ul></div></details><details class="qa"><summary><span class="chip">Formula</span> What is the justified (Gordon) P/E?</summary><div class="rich"><div class="fx">Forward P/E = Payout ratio ÷ (Ke − g)</div><div class="fx">Trailing P/E = Payout ratio × (1 + g) ÷ (Ke − g)</div><p>Example: payout 60%, Ke 9%, g 3% → forward P/E = 0.6 ÷ 0.06 = 10x.</p></div></details><details class="qa"><summary><span class="chip">Concept</span> Why don't you use EV/EBITDA for banks? What do you use?</summary><div class="rich"><p>For banks, debt (deposits and wholesale funding) is the raw material and interest is an operating cost, so EV and EBITDA are meaningless.<br>Use <strong>P/B or P/TBV</strong> (linked to ROE), <strong>P/E</strong> and <strong>dividend yield</strong>. Value with DDM or residual income.</p></div></details><details class="qa"><summary><span class="chip">Concept</span> How are REITs valued?</summary><div class="rich"><ul><li><strong>P/NTA</strong>: price vs net tangible assets (property valuations) per unit; premium or discount to NTA</li><li><strong>FFO / AFFO yield</strong>: funds from operations (profit excluding revaluations and D&amp;A); AFFO also deducts maintenance capex and incentives</li><li><strong>Distribution yield</strong> and <strong>gearing</strong> (debt ÷ total assets)</li></ul></div></details><details class="qa"><summary><span class="chip">Concept</span> How are miners valued?</summary><div class="rich"><ul><li><strong>P/NAV</strong>: price vs NPV of the mine plan (the core method)</li><li><strong>EV/EBITDA</strong> at spot and at consensus commodity prices</li><li><strong>EV/resource or reserve</strong> (per tonne or ounce) for developers and explorers</li></ul><p>Key sensitivities: commodity price, AUD/USD, costs, reserve life.</p></div></details><details class="qa"><summary><span class="chip">Concept</span> How are software / SaaS companies valued?</summary><div class="rich"><ul><li><strong>EV/Revenue</strong> or <strong>EV/ARR</strong> (annual recurring revenue)</li><li><strong>Rule of 40</strong>: revenue growth % + EBITDA (or FCF) margin % ≥ 40</li><li>Net revenue retention, gross margin, CAC payback</li></ul><p>DCFs need long horizons because profits are back-ended.</p></div></details><details class="qa"><summary><span class="chip">Concept</span> Which multiples and KPIs matter for an ASX retailer?</summary><div class="rich"><ul><li><strong>EV/EBIT</strong> and <strong>P/E</strong> (EV/EBITDA is distorted by AASB 16)</li><li>LFL / same-store sales growth, gross margin, CODB (cost of doing business) % of sales</li><li>Sales per store or per sqm, store rollout and payback</li><li>Inventory days, customer deposits, AUD/USD for importers</li></ul></div></details><details class="qa"><summary><span class="chip">Interview</span> How would you value a pre-revenue biotech?</summary><div class="rich"><p>Multiples don't work (no sales or earnings). Use:</p><ul><li><strong>Risk-adjusted NPV (rNPV)</strong>: forecast cash flows per drug, weighted by probability of approval at each trial phase</li><li>Compare EV with cash (often a large share of market cap)</li><li>Cash runway and funding needs (dilution risk)</li></ul></div></details><details class="qa"><summary><span class="chip">Interview</span> Why might a stock on 30x P/E be cheaper than one on 10x?</summary><div class="rich"><ul><li><strong>Growth</strong>: on PEG the 30x stock may be cheaper if earnings grow much faster</li><li><strong>Cyclicality</strong>: cyclicals look cheapest on P/E at peak earnings, just before earnings fall</li><li><strong>One-offs</strong>: depressed or inflated current earnings</li><li><strong>Balance sheet</strong>: the 10x company may carry heavy debt (check EV multiples)</li><li><strong>Quality</strong>: returns on capital and durability</li></ul></div></details><details class="qa"><summary><span class="chip">Interview</span> Why might a company look cheap on P/E but expensive on EV/EBITDA?</summary><div class="rich"><ul><li><strong>High debt</strong>: P/E only prices the equity slice; EV adds the debt back, so an indebted company can look cheap on P/E but not on EV/EBITDA</li><li><strong>Low D&amp;A or tax</strong>: e.g. tax losses lift NPAT</li><li><strong>Associates or non-operating income</strong> boosting NPAT but not EBITDA</li></ul><p>The reverse happens for net-cash or capital-intensive companies.</p></div></details><details class="qa"><summary><span class="chip">Concept</span> Walk me through building a trading comps table.</summary><div class="rich"><ul><li>Pick peers: industry, business model, size, growth, geography</li><li>Pull financials and consensus; adjust for one-offs and AASB 16 consistency</li><li>Calendarise to a common year-end</li><li>Calculate EV and equity value (diluted) and the multiples</li><li>Take median and interquartile range</li><li>Apply to the target's metrics and adjust for differences in growth and quality</li></ul></div></details><details class="qa"><summary><span class="chip">Concept</span> How do you value a cyclical company with multiples?</summary><div class="rich"><p>Use <strong>normalised (mid-cycle) earnings</strong>, not current earnings. At the peak, P/E looks low because earnings are temporarily high; at the trough P/E looks high or negative.<br>Classic rule: buy cyclicals when the P/E is high, sell when it is low.</p></div></details></div></section><section id="s-val" class="block"><div class="eyebrow">Section</div><h2 style="font-size:24px">Valuation methods</h2><details class="notes-body"><summary><strong>Notes</strong></summary><div class="rich"><h3>DCF in six steps</h3><ul><li>Forecast FCFF for 5–10 years</li><li>Estimate WACC</li><li>Calculate terminal value (Gordon growth or exit multiple)</li><li>Discount the FCFF and TV to today → enterprise value</li><li>EV − net debt − NCI − prefs + associates → equity value</li><li>÷ diluted shares → value per share; run sensitivities (WACC × g)</li></ul><h3>Discount rate</h3><div class="fx">Ke = rf + β × ERP</div><div class="fx">WACC = E/(D+E) × Ke + D/(D+E) × Kd × (1 − t)</div><div class="fx">Unlever: βu = βL ÷ [1 + (1 − t) × D/E]</div><div class="fx">Relever: βL = βu × [1 + (1 − t) × D/E]</div><p>Use market values and the target capital structure.</p><h3>Terminal value</h3><div class="fx">Gordon: TV = FCF(n) × (1 + g) ÷ (WACC − g)</div><div class="fx">Exit multiple: TV = EBITDA(n) × multiple</div><div class="fx">Implied g from an exit multiple: g = (TV × WACC − FCF) ÷ (TV + FCF)</div><p>TV is usually 60–80% of EV. Keep g at or below long-run nominal GDP (~2–3% for Australia).</p><h3>Other methods</h3><div class="tw"><table><thead><tr><th>Method</th><th>Use</th><th>Note</th></tr></thead><tbody><tr><td>Trading comps</td><td>Relative value today</td><td>Pick peers on industry, size, growth</td></tr><tr><td>Precedent transactions</td><td>M&amp;A pricing</td><td>Includes a 20–40% control premium</td></tr><tr><td>DDM</td><td>Banks, utilities</td><td>P = D1 ÷ (Ke − g)</td></tr><tr><td>Residual income</td><td>Banks</td><td>Value = BV + PV of (ROE − Ke) × BV</td></tr><tr><td>Sum of the parts</td><td>Conglomerates</td><td>Subtract capitalised corporate costs</td></tr><tr><td>Reverse DCF</td><td>What is priced in?</td><td>Solve for the growth or margin the price implies</td></tr><tr><td>LBO</td><td>Floor value for PE buyers</td><td>Returns from growth, multiple and deleveraging</td></tr></tbody></table></div><h3>Deal maths (IB)</h3><ul><li>All-stock deal is accretive if acquirer P/E &gt; P/E paid for the target</li><li>Cash deal is accretive if target earnings yield (at the price paid) &gt; after-tax cost of debt</li></ul><div class="fx">IRR ≈ MOIC^(1/years) − 1   (2x in 3y ≈ 26%, 2x in 5y ≈ 15%, 3x in 5y ≈ 25%)</div></div></details><h3 style="margin-top:8px">Cards: tap a question to reveal the answer</h3><div><details class="qa"><summary><span class="chip">Interview</span> Walk me through a DCF.</summary><div class="rich"><ul><li>Forecast unlevered free cash flow (FCFF) for 5–10 years from revenue, margins, tax, capex and working capital</li><li>Calculate WACC from the cost of equity (CAPM) and after-tax cost of debt at target weights</li><li>Calculate terminal value with Gordon growth or an exit multiple</li><li>Discount FCFF and TV to today and sum → enterprise value</li><li>Subtract net debt (and NCI, prefs; add associates) → equity value</li><li>Divide by diluted shares → value per share; sensitise WACC and g</li></ul></div></details><details class="qa"><summary><span class="chip">Formula</span> WACC formula?</summary><div class="rich"><div class="fx">WACC = E/(D+E) × Ke + D/(D+E) × Kd × (1 − t)</div><p>Use market values and the target (long-run) capital structure. Kd × (1 − t) because interest is tax-deductible.</p></div></details><details class="qa"><summary><span class="chip">Formula</span> CAPM: cost of equity?</summary><div class="rich"><div class="fx">Ke = rf + β × ERP</div><ul><li>rf: long-term government bond yield (10-year ACGB in Australia)</li><li>β: sensitivity of the stock to the market</li><li>ERP: market return above rf (~6% in Australian practice)</li></ul><p>Some add size or specific-risk premiums.</p></div></details><details class="qa"><summary><span class="chip">Formula</span> How do you unlever and relever beta?</summary><div class="rich"><div class="fx">βu = βL ÷ [1 + (1 − t) × D/E]</div><div class="fx">βL = βu × [1 + (1 − t) × D/E]</div><p>(Hamada; assumes debt beta of zero.)</p></div></details><details class="qa"><summary><span class="chip">Concept</span> Why do you unlever and relever betas from comparables?</summary><div class="rich"><p>Each comparable's observed (levered) beta reflects both business risk and its own leverage. Unlevering strips out leverage to get asset (business-risk) beta. Average the peers' asset betas, then relever at the target's capital structure.</p></div></details><details class="qa"><summary><span class="chip">Formula</span> Gordon growth terminal value formula?</summary><div class="rich"><div class="fx">TV = FCF(n) × (1 + g) ÷ (WACC − g)</div><p>The TV sits at the end of year n, so discount it by (1 + WACC)^n. Requires WACC &gt; g; small changes in either move TV a lot.</p></div></details><details class="qa"><summary><span class="chip">Formula</span> Exit multiple terminal value method?</summary><div class="rich"><div class="fx">TV = EBITDA(n) × EV/EBITDA multiple</div><p>Use a multiple from current comps or precedents, then discount by (1 + WACC)^n.<br>Weakness: it imports today's market pricing into an intrinsic valuation.</p></div></details><details class="qa"><summary><span class="chip">Concept</span> How do you sanity-check a terminal value?</summary><div class="rich"><ul><li>TV share of EV: typically 60–80%; much higher means most value is beyond the forecast</li><li>Gordon g ≤ long-run nominal GDP (~2–3% in Australia)</li><li>Cross-check: implied exit multiple from Gordon (TV ÷ EBITDA(n)) vs comps</li><li>Implied g from an exit multiple:</li></ul><div class="fx">g = (TV × WACC − FCF) ÷ (TV + FCF)</div></div></details><details class="qa"><summary><span class="chip">Concept</span> What is the mid-year convention?</summary><div class="rich"><p>Cash flows arrive through the year, not all at year end, so discount each year's FCF at t − 0.5 instead of t. This lifts value by about (1 + WACC)^0.5.<br>A Gordon TV is often discounted with the final year's factor; an exit-multiple TV is usually discounted at full year n (it is a point-in-time sale).</p></div></details><details class="qa"><summary><span class="chip">Concept</span> What are the key levers in a DCF and how do you present sensitivity?</summary><div class="rich"><p>Levers: revenue growth, EBIT margin, capex and working capital intensity, tax, WACC, terminal growth or exit multiple.<br>Show two-way tables: <strong>WACC × terminal g</strong> (or × exit multiple) and an operating one (e.g. growth × margin). WACC and g matter most because they drive TV.</p></div></details><details class="qa"><summary><span class="chip">Concept</span> What is a reverse DCF and when is it useful?</summary><div class="rich"><p>Instead of forecasting and solving for value, fix the value at today's share price and solve for the growth, margin or terminal assumption that justifies it.<br>It answers "what is the market pricing in?". Useful when arguing a variant view: show the implied assumptions are too pessimistic (BUY) or too optimistic (SELL).</p></div></details><details class="qa"><summary><span class="chip">Concept</span> What is the dividend discount model and when is it used?</summary><div class="rich"><div class="fx">P = D1 ÷ (Ke − g)</div><p>Value equals the present value of future dividends, discounted at the cost of equity. Multi-stage versions handle high growth first.<br>Used for banks, insurers and utilities with stable payouts.</p></div></details><details class="qa"><summary><span class="chip">Concept</span> What is the residual income model?</summary><div class="rich"><div class="fx">Value = Book value + PV of [(ROE − Ke) × Book value]</div><p>Value above book comes only from earning more than the cost of equity. Common for banks; it is consistent with justified P/B = (ROE − g) ÷ (Ke − g).</p></div></details><details class="qa"><summary><span class="chip">Concept</span> What is a sum-of-the-parts valuation?</summary><div class="rich"><p>Value each segment separately with the method and multiple suited to it, add them, subtract capitalised corporate costs (corporate cost × multiple) and net debt.<br>Used for conglomerates (e.g. Wesfarmers). Markets often apply a conglomerate discount.</p></div></details><details class="qa"><summary><span class="chip">Concept</span> Precedent transactions: what are they and why are they usually higher than trading comps?</summary><div class="rich"><p>Multiples paid in past acquisitions of similar companies. They include a <strong>control premium</strong> (typically 20–40%) for control and synergies, so they sit above trading multiples.<br>Weaknesses: deals can be old, market conditions differ, and disclosure is limited.</p></div></details><details class="qa"><summary><span class="chip">Concept</span> On a football-field chart, how do the methods usually rank?</summary><div class="rich"><ul><li><strong>Precedent transactions</strong>: usually highest (control premium)</li><li><strong>DCF</strong>: widest range, depends on assumptions</li><li><strong>Trading comps</strong>: middle</li><li><strong>52-week trading range</strong>: reference point</li><li><strong>LBO</strong>: often the floor (what a financial buyer can pay)</li></ul></div></details><details class="qa"><summary><span class="chip">Interview</span> When would you use an FCFE (levered) DCF instead of FCFF?</summary><div class="rich"><p>For banks and other financials, where debt is an operating input and interest is a cost of goods sold, so EV is not meaningful. Also when the capital struct
